[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegverse-llm-adapter"
version = "2.3.1"
description = "Governed bridge for bounded user-controlled LLM access to StegVerse services"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "StegVerse", email = "dev@stegverse.org"}
]
keywords = ["llm", "governance", "stegverse", "ai-safety", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "stegverse-sdk @ git+https://github.com/StegVerse-org/StegVerse-SDK.git@3e9e7f31e4cdc65a017d0766b2a7d0ba6b66eca7",
]

[project.optional-dependencies]
# FastAPI, Starlette, pydantic, uvicorn, httpx and python-multipart are replaced
# by the standard-library web layer in llm_adapter/web, and jsonschema by
# llm_adapter/json_schema.py (LLMA-368).
dev = [
    "pytest>=7.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]
stegcore-integration = [
    "stegcore @ git+https://github.com/StegVerse-Labs/StegCore.git@8c484e584d60a3bd2763d6948d0eb3f4afd67e0c",
]
service = [
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.scripts]
stegverse-llm-adapter = "llm_adapter.cli:main"
stegnode-bootstrap = "llm_adapter.node_bootstrap:main"
stegnode = "llm_adapter.node_service:main"
stegverse-user-llm-service = "llm_adapter.user_llm_service:main"
stegverse-service-gateway = "llm_adapter.runtime_gateway:main"

[project.urls]
Homepage = "https://github.com/StegVerse-org/LLM-adapter"
Repository = "https://github.com/StegVerse-org/LLM-adapter"
Issues = "https://github.com/StegVerse-org/LLM-adapter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_adapter*", "va_claim_assistant*"]

