services:
  - type: pserv
    name: stegverse-master-records-custody
    repo: https://github.com/master-records/orchestration
    branch: main
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install -r requirements-service.txt
    startCommand: uvicorn services.master_records_custody_api:app --host 0.0.0.0 --port $PORT
    disk:
      name: master-records-custody-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: MASTER_RECORDS_DB
        value: /var/data/master-records-custody.db
      - key: MASTER_RECORDS_STORAGE_DURABLE_ACROSS_RESTARTS
        value: "true"
      - key: MASTER_RECORDS_AUTH_TOKEN
        generateValue: true
      - key: MASTER_RECORDS_RECEIPT_KEY
        generateValue: true

  - type: web
    name: stegverse-ecosystem-chat-gateway
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install -e '.[service]'
    startCommand: python -m llm_adapter.custody_worker && uvicorn llm_adapter.combined_gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    disk:
      name: stegverse-chat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: STEGVERSE_ALLOWED_ORIGINS
        value: https://stegverse.org,https://www.stegverse.org,https://stegverse-labs.github.io
      - key: STEGVERSE_CHAT_RATE_LIMIT
        value: 20
      - key: STEGVERSE_CHAT_RATE_WINDOW_SECONDS
        value: 3600
      - key: STEGVERSE_TRANSITION_DB
        value: /var/data/stegverse-ecosystem-chat.db
      - key: STEGVERSE_USAGE_SESSION_DB
        value: /var/data/stegverse-usage-sessions.db
      - key: STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS
        value: "true"
      - key: STEGVERSE_EXTERNAL_REVIEW_DB
        value: /var/data/stegverse-external-review.db
      - key: STEGVERSE_EXTERNAL_REVIEW_SUBMIT_TOKEN
        generateValue: true
      - key: STEGVERSE_EXTERNAL_REVIEW_RECEIPT_KEY
        generateValue: true
      - key: STEGVERSE_EXTERNAL_REVIEWERS_JSON
        value: "{}"
      - key: STEGVERSE_EXTERNAL_PUBLISHERS_JSON
        value: "{}"
      - key: STEGVERSE_EXTERNAL_MUTATION_ENABLED
        value: "false"
      - key: STEGVERSE_EXTERNAL_MUTATORS_JSON
        value: "{}"
      - key: STEGVERSE_MASTER_RECORDS_HOSTPORT
        fromService:
          type: pserv
          name: stegverse-master-records-custody
          property: hostport
      - key: STEGVERSE_MASTER_RECORDS_TOKEN
        fromService:
          type: pserv
          name: stegverse-master-records-custody
          envVarKey: MASTER_RECORDS_AUTH_TOKEN
      - key: STEGVERSE_ALLOW_PRIVATE_MASTER_RECORDS_HTTP
        value: "true"
      - key: STEGVERSE_MASTER_RECORDS_TIMEOUT_SECONDS
        value: "10"
      - key: STEGVERSE_PROVIDER_ENABLED
        value: "true"
      - key: STEGVERSE_PROVIDER_ENDPOINT
        sync: false
      - key: STEGVERSE_PROVIDER_ALLOWED_HOSTS
        sync: false
      - key: STEGVERSE_PROVIDER_TOKEN
        sync: false
      - key: STEGVERSE_PROVIDER_NAME
        sync: false
      - key: STEGVERSE_PROVIDER_MODEL
        sync: false
      - key: STEGVERSE_PROVIDER_DAILY_REQUEST_LIMIT
        value: 100
      - key: STEGVERSE_PROVIDER_DAILY_COST_LIMIT_USD
        value: "5.00"
      - key: STEGVERSE_PROVIDER_MAX_REQUEST_COST_USD
        value: "0.25"
      - key: STEGVERSE_PROVIDER_MAX_INPUT_CHARS
        value: 12000
      - key: STEGVERSE_PROVIDER_MAX_OUTPUT_CHARS
        value: 6000
      - key: STEGVERSE_PROVIDER_TIMEOUT_SECONDS
        value: 20
