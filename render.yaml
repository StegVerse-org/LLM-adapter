services:
  - type: web
    name: stegverse-hil-receiver
    runtime: docker
    plan: starter
    region: ohio
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/hil/readiness
    envVars:
      - key: STEGVERSE_DATA_DIR
        value: /var/lib/stegverse
      - key: STEGVERSE_HIL_INTAKE_ENABLED
        value: "true"
      - key: STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS
        value: "true"
      - key: STEGVERSE_ALLOWED_ORIGINS
        value: https://stegverse-labs.github.io,https://stegverse.org,https://www.stegverse.org
      - key: STEGVERSE_HIL_REVIEW_TOKEN
        generateValue: true
      - key: STEGVERSE_HIL_PUBLICATION_TOKEN
        generateValue: true
    disk:
      name: stegverse-hil-state
      mountPath: /var/lib/stegverse
      sizeGB: 1
