name: Authorized Provider Execution Boundary

on:
  pull_request:
    paths:
      - "contracts/authorized-provider-execution-boundary.json"
      - "scripts/check_authorized_provider_execution_boundary.py"
      - ".github/workflows/authorized-provider-execution-boundary.yml"
  push:
    paths:
      - "contracts/authorized-provider-execution-boundary.json"
      - "scripts/check_authorized_provider_execution_boundary.py"
      - ".github/workflows/authorized-provider-execution-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate authorized-provider execution boundary
        run: python scripts/check_authorized_provider_execution_boundary.py
