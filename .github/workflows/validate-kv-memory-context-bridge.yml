name: Validate KV Memory Context Bridge

on:
  push:
    paths:
      - 'llm_adapter/kv_memory_context_bridge.py'
      - 'tests/test_kv_memory_context_bridge.py'
      - 'docs/KV_AI_MEMORY_CONTEXT_BRIDGE_MIRROR_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/validate-kv-memory-context-bridge.yml'
  pull_request:
    paths:
      - 'llm_adapter/kv_memory_context_bridge.py'
      - 'tests/test_kv_memory_context_bridge.py'
      - 'docs/KV_AI_MEMORY_CONTEXT_BRIDGE_MIRROR_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/validate-kv-memory-context-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_kv_memory_context_bridge.py
