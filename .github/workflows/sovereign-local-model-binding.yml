name: Sovereign Local Model Binding Proof

on:
  pull_request:
    paths:
      - "llm_adapter/http_provider_clients.py"
      - "llm_adapter/local_model_runtime.py"
      - "llm_adapter/sovereign_local_model_binding.py"
      - "scripts/prove_sovereign_local_model_binding.py"
      - "scripts/check_ecosystem_chat_sovereign_orchestration_state.py"
      - "tests/test_sovereign_local_model_binding.py"
      - "receipts/local-runtime-model-proof.latest.json"
      - "tasks/LLMA-SOVEREIGN-LOCAL-MODEL-BINDING-019.json"
      - "data/ecosystem-chat-sovereign-orchestration-state.json"
      - ".github/workflows/sovereign-local-model-binding.yml"
  push:
    branches: [main]
    paths:
      - "llm_adapter/http_provider_clients.py"
      - "llm_adapter/local_model_runtime.py"
      - "llm_adapter/sovereign_local_model_binding.py"
      - "scripts/prove_sovereign_local_model_binding.py"
      - "scripts/check_ecosystem_chat_sovereign_orchestration_state.py"
      - "tests/test_sovereign_local_model_binding.py"
      - "receipts/local-runtime-model-proof.latest.json"
      - "tasks/LLMA-SOVEREIGN-LOCAL-MODEL-BINDING-019.json"
      - "data/ecosystem-chat-sovereign-orchestration-state.json"
      - ".github/workflows/sovereign-local-model-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Validate current sovereign ownership and blocker state
        run: python scripts/check_ecosystem_chat_sovereign_orchestration_state.py
      - name: Focused provider and binding tests
        run: >-
          python -m pytest -q
          tests/test_http_provider_clients.py
          tests/test_provider_usage.py
          tests/test_master_records_usage_submission.py
          tests/test_sovereign_local_model_binding.py
      - name: Execute real repository-local runtime through sovereign provider seam
        run: python scripts/prove_sovereign_local_model_binding.py --output artifacts/sovereign-local-model-binding.json
      - name: Fail closed on false activation or missing measured evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/sovereign-local-model-binding.json').read_text())
          assert p['state'] == 'PASS'
          assert p['real_local_process_executed'] is True
          assert p['private_provider_seam_executed'] is True
          assert p['third_party_execution_platform_required'] is False
          assert p['product_activation_granted'] is False
          assert p['master_records_usage_submission']['status'] == 'NOT_CONFIGURED'
          assert p['binding_receipt']['activation_complete'] is False
          for key in ('prompt_tokens','completion_tokens','total_tokens','latency_ms'):
              assert p['provider_usage_event']['metrics'][key]['evidence_class'] == 'MEASURED'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-local-model-binding-proof-${{ github.run_id }}
          path: artifacts/sovereign-local-model-binding.json
          if-no-files-found: error
          retention-days: 90
