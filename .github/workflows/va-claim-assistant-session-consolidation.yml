name: VA Claim Assistant Session Consolidation

on:
  push:
    branches: [main]
    paths:
      - 'data/va-claim-assistant-session-consolidation.json'
      - 'scripts/validate_va_claim_assistant_session_consolidation.py'
      - 'tasks/VACP-SESSION-CONSOLIDATION-007.json'
      - 'tasks/VACP-ADAPTER-PII-RUNTIME-006.json'
      - 'tasks/VACP-ADAPTER-AUTHORIZED-EXECUTION-005.json'
      - 'receipts/va-claim-assistant-privacy-runtime-validation.json'
      - 'docs/VA_CLAIM_ASSISTANT_SESSION_ARCHIVE_MIRROR_HANDOFF.md'
      - '.github/workflows/va-claim-assistant-session-consolidation.yml'
  pull_request:
    paths:
      - 'data/va-claim-assistant-session-consolidation.json'
      - 'scripts/validate_va_claim_assistant_session_consolidation.py'
      - 'tasks/VACP-SESSION-CONSOLIDATION-007.json'
      - 'tasks/VACP-ADAPTER-PII-RUNTIME-006.json'
      - 'tasks/VACP-ADAPTER-AUTHORIZED-EXECUTION-005.json'
      - 'receipts/va-claim-assistant-privacy-runtime-validation.json'
      - 'docs/VA_CLAIM_ASSISTANT_SESSION_ARCHIVE_MIRROR_HANDOFF.md'
      - '.github/workflows/va-claim-assistant-session-consolidation.yml'
  schedule:
    - cron: '53 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claim-assistant-session-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-session-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate complete goal inventory and archive disposition
        run: python scripts/validate_va_claim_assistant_session_consolidation.py

      - name: Verify non-authority archive receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('receipts/va-claim-assistant-session-consolidation-validation.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          material = {key: item for key, item in value.items() if key != 'receipt_hash'}
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          assert actual == value['receipt_hash']
          assert value['state'] == 'PASS'
          assert value['posture'] == 'ARCHIVE_READY'
          assert value['consolidation_task_state'] == 'RELEASED_COMPLETE'
          assert value['archive_safe'] is True
          assert value['deleting_chat_impairs_execution'] is False
          assert value['active_chat_owned_claims'] == 0
          assert value['unowned_tasks'] == 0
          assert value['manual_user_tasks'] == 0
          assert value['authority_effect'] is False
          assert value['activation_effect'] is False
          assert value['custody_claimed'] is False
          assert value['filing_authorized'] is False
          assert value['publication_authorized'] is False
          print(f"archive receipt {value['receipt_hash']}")
          PY

      - name: Persist archive validation receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'va-claim-assistant[bot]'
          git config user.email 'va-claim-assistant[bot]@users.noreply.github.com'
          git add receipts/va-claim-assistant-session-consolidation-validation.json
          if git diff --cached --quiet; then
            echo 'Archive receipt unchanged.'
          else
            git commit -m 'receipt: persist VA session archive evidence [skip ci]'
            git pull --rebase
            git push
          fi

      - name: Upload archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-claim-assistant-session-consolidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/va-claim-assistant-session-consolidation.json
            receipts/va-claim-assistant-session-consolidation-validation.json
            tasks/VACP-SESSION-CONSOLIDATION-007.json
          if-no-files-found: error
          retention-days: 90
