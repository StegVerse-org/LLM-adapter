name: capability-runtime

on:
  push:
    paths:
      - 'runtime/capabilities/**'
      - 'llm_adapter/capability_runtime.py'
      - 'llm_adapter/portable_node.py'
      - 'llm_adapter/node_bootstrap.py'
      - 'llm_adapter/node_service.py'
      - 'llm_adapter/node_autostart.py'
      - 'pyproject.toml'
      - 'scripts/stegcap.py'
      - 'scripts/stegnode.py'
      - 'tests/test_capability_runtime.py'
      - 'tests/test_portable_node.py'
      - 'tests/test_portable_node_bootstrap.py'
      - 'tests/test_node_bootstrap.py'
      - 'tests/test_node_service.py'
      - 'tests/test_node_autostart.py'
      - '.github/workflows/capability-runtime.yml'
  pull_request:
    paths:
      - 'runtime/capabilities/**'
      - 'llm_adapter/capability_runtime.py'
      - 'llm_adapter/portable_node.py'
      - 'llm_adapter/node_bootstrap.py'
      - 'llm_adapter/node_service.py'
      - 'llm_adapter/node_autostart.py'
      - 'pyproject.toml'
      - 'scripts/stegcap.py'
      - 'scripts/stegnode.py'
      - 'tests/test_capability_runtime.py'
      - 'tests/test_portable_node.py'
      - 'tests/test_portable_node_bootstrap.py'
      - 'tests/test_node_bootstrap.py'
      - 'tests/test_node_service.py'
      - 'tests/test_node_autostart.py'
      - '.github/workflows/capability-runtime.yml'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:$key"
              exit 1
            fi
          done

      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve requested Python without token-backed setup actions
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          wrapper="$PWD/.stegverse-python"
          selected=""
          if command -v "python${PYTHON_VERSION}" >/dev/null 2>&1; then
            selected="$(command -v "python${PYTHON_VERSION}")"
          elif command -v py >/dev/null 2>&1; then
            printf '#!/usr/bin/env bash\nexec py -%q "$@"\n' "$PYTHON_VERSION" > "$wrapper"
          else
            selected="$(find "${RUNNER_TOOL_CACHE:-/nonexistent}" -type f \( -name python -o -name python.exe \) 2>/dev/null | grep -E "[/\\]Python[/\\]${PYTHON_VERSION}([./\\]|$)" | head -n 1 || true)"
            if [ -z "$selected" ]; then
              bootstrap="$(command -v python3 || command -v python || true)"
              if [ -z "$bootstrap" ]; then
                echo "bootstrap_python_not_found"
                exit 1
              fi
              "$bootstrap" -m pip install --user uv
              uv_bin="$(command -v uv || true)"
              if [ -z "$uv_bin" ]; then
                user_base="$($bootstrap -m site --user-base)"
                uv_bin="$user_base/bin/uv"
              fi
              "$uv_bin" python install "$PYTHON_VERSION"
              selected="$($uv_bin python find "$PYTHON_VERSION")"
            fi
          fi
          if [ ! -s "$wrapper" ]; then
            printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$selected" > "$wrapper"
          fi
          chmod +x "$wrapper"
          echo "PYTHON_BIN=$wrapper" >> "$GITHUB_ENV"
          "$wrapper" --version
          "$wrapper" - <<'PY'
          import sys
          expected = tuple(map(int, "${{ matrix.python }}".split('.')))
          assert sys.version_info[:2] == expected, (sys.version, expected)
          print("CAPABILITY_RUNTIME_PYTHON=PASS")
          PY

      - name: Install runtime dependencies
        shell: bash
        run: "$PYTHON_BIN -m pip install -e '.[dev]'"

      - name: Validate capability manifest
        shell: bash
        run: "$PYTHON_BIN scripts/stegcap.py show-manifest"

      - name: Test capability reconstruction and portable resolution
        shell: bash
        run: >-
          "$PYTHON_BIN" -m pytest
          tests/test_capability_runtime.py
          tests/test_portable_node.py
          tests/test_portable_node_bootstrap.py
          tests/test_node_bootstrap.py
          tests/test_node_service.py
          tests/test_node_autostart.py
          -v

      - name: Verify installed zero-touch bootstrap command
        shell: bash
        run: "$PYTHON_BIN -m llm_adapter.node_bootstrap bootstrap --root .stegdeploy/ci-portable-node"

      - name: Verify autonomous service status command
        shell: bash
        run: "$PYTHON_BIN scripts/stegnode.py status --root .stegdeploy/ci-portable-node"

      - name: Verify autostart materialization without activation
        shell: bash
        run: >-
          "$PYTHON_BIN" -c
          "from pathlib import Path; from llm_adapter.node_autostart import materialize; import platform; materialize(Path('.stegdeploy/ci-portable-node').resolve(), system=platform.system())"

      - name: Confirm non-authorizing validation scope
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/capability-runtime.yml').read_text(encoding='utf-8')
          assert 'permissions: {}' in workflow
          assert 'actions/checkout@' not in workflow
          assert 'actions/setup-python@' not in workflow
          assert 'persist-credentials' not in workflow
          assert 'github_token_runtime_authority' in Path('llm_adapter/node_bootstrap.py').read_text(encoding='utf-8')
          print('CAPABILITY_RUNTIME_CREDENTIAL_AUTHORITY=TV_TVC')
          print('CAPABILITY_RUNTIME_GITHUB_TOKEN_AUTHORITY=NONE')
          print('CAPABILITY_RUNTIME_ACTIVATION_EFFECT=NONE')
          PY
