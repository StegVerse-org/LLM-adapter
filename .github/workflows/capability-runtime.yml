name: capability-runtime

on:
  push:
    paths:
      - 'runtime/capabilities/**'
      - 'llm_adapter/capability_runtime.py'
      - 'llm_adapter/portable_node.py'
      - 'llm_adapter/node_bootstrap.py'
      - 'llm_adapter/node_service.py'
      - 'pyproject.toml'
      - 'scripts/stegcap.py'
      - 'scripts/stegnode.py'
      - 'tests/test_capability_runtime.py'
      - 'tests/test_portable_node.py'
      - 'tests/test_portable_node_bootstrap.py'
      - 'tests/test_node_bootstrap.py'
      - 'tests/test_node_service.py'
      - '.github/workflows/capability-runtime.yml'
  pull_request:
    paths:
      - 'runtime/capabilities/**'
      - 'llm_adapter/capability_runtime.py'
      - 'llm_adapter/portable_node.py'
      - 'llm_adapter/node_bootstrap.py'
      - 'llm_adapter/node_service.py'
      - 'pyproject.toml'
      - 'scripts/stegcap.py'
      - 'scripts/stegnode.py'
      - 'tests/test_capability_runtime.py'
      - 'tests/test_portable_node.py'
      - 'tests/test_portable_node_bootstrap.py'
      - 'tests/test_node_bootstrap.py'
      - 'tests/test_node_service.py'
      - '.github/workflows/capability-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate capability manifest
        run: python scripts/stegcap.py show-manifest
      - name: Test capability reconstruction and portable resolution
        run: python -m pytest tests/test_capability_runtime.py tests/test_portable_node.py tests/test_portable_node_bootstrap.py tests/test_node_bootstrap.py tests/test_node_service.py -v
      - name: Verify installed zero-touch bootstrap command
        run: stegnode-bootstrap bootstrap --root .stegdeploy/ci-portable-node
      - name: Verify autonomous service status command
        run: stegnode status --root .stegdeploy/ci-portable-node