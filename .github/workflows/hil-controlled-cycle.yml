name: HIL Controlled Cycle

on:
  pull_request:
    paths:
      - "llm_adapter/hil_intake_api.py"
      - "llm_adapter/hil_publication_api.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - "pyproject.toml"
      - ".github/workflows/hil-controlled-cycle.yml"
  push:
    branches: [main, build/hil-intake-gateway]
    paths:
      - "llm_adapter/hil_intake_api.py"
      - "llm_adapter/hil_publication_api.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - "pyproject.toml"
      - ".github/workflows/hil-controlled-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,service]"
      - name: Run HIL intake, review, publication, and restart tests
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python -m pytest -q \
            tests/test_hil_intake_api.py \
            tests/test_hil_provenance_chain.py \
            tests/test_hil_publication_api.py \
            tests/test_hil_controlled_cycle.py \
            2>&1 | tee reports/hil-controlled-cycle-pytest.log
      - name: Emit non-authorizing completion receipt
        if: always()
        run: |
          mkdir -p reports
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "schema_version": "HIL-CONTROLLED-CYCLE-CI-v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "observation_only": True,
              "deployment_authority": False,
              "publication_authority": False,
              "master_record_append_authority": False,
          }
          with open("reports/hil-controlled-cycle-ci.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-controlled-cycle-ci
          path: reports/
          if-no-files-found: error
