name: Validate TV-TVC Service Return

on:
  workflow_call:
    inputs:
      bundle_path:
        required: true
        type: string
      ledger_receipt_path:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bundle_path:
        required: true
        type: string
      ledger_receipt_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governed return package
        run: |
          python scripts/validate_tv_tvc_service_return.py \
            "${{ inputs.bundle_path }}" \
            "${{ inputs.ledger_receipt_path }}"
