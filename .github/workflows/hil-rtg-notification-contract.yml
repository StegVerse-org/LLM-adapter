name: HIL RTG Notification Contract

on:
  push:
    paths:
      - "llm_adapter/service_gateway.py"
      - "llm_adapter/service_gateway_site.py"
      - "llm_adapter/notification_delivery.py"
      - "schemas/hil-attempt-notification-v1.schema.json"
      - "schemas/hil-submission-status-v1.schema.json"
      - "schemas/hil-readiness-v1.schema.json"
      - "schemas/hil-tvc-authority-evidence-v1.schema.json"
      - "scripts/verify_hil_rtg_notification_contract.py"
      - "tests/test_hil_notification_delivery.py"
      - "tests/test_hil_gateway_attempt_contract.py"
      - "tests/test_hil_submission_status.py"
      - "tests/test_hil_notification_schema.py"
      - "tests/test_hil_submission_status_schema.py"
      - "tests/test_hil_readiness_contract.py"
      - "tests/test_hil_readiness_schema.py"
      - "tests/test_hil_authority_evidence.py"
      - "tests/test_hil_authority_evidence_schema.py"
      - "docs/HIL_RTG_DEPLOYMENT_RUNBOOK.md"
      - ".github/workflows/hil-rtg-notification-contract.yml"
  pull_request:
    paths:
      - "llm_adapter/service_gateway.py"
      - "llm_adapter/service_gateway_site.py"
      - "llm_adapter/notification_delivery.py"
      - "schemas/hil-attempt-notification-v1.schema.json"
      - "schemas/hil-submission-status-v1.schema.json"
      - "schemas/hil-readiness-v1.schema.json"
      - "schemas/hil-tvc-authority-evidence-v1.schema.json"
      - "scripts/verify_hil_rtg_notification_contract.py"
      - "tests/test_hil_notification_delivery.py"
      - "tests/test_hil_gateway_attempt_contract.py"
      - "tests/test_hil_submission_status.py"
      - "tests/test_hil_notification_schema.py"
      - "tests/test_hil_submission_status_schema.py"
      - "tests/test_hil_readiness_contract.py"
      - "tests/test_hil_readiness_schema.py"
      - "tests/test_hil_authority_evidence.py"
      - "tests/test_hil_authority_evidence_schema.py"
      - "docs/HIL_RTG_DEPLOYMENT_RUNBOOK.md"
      - ".github/workflows/hil-rtg-notification-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check fastapi python-multipart pytest jsonschema
      - name: Compile transition runtime modules
        run: python -m compileall -q llm_adapter tests
      - name: Verify RTG notification, retry, participant-status, discovery, authority, and privacy contract
        run: python scripts/verify_hil_rtg_notification_contract.py
      - name: Test RTG attempt, delivery, status, discovery, authority, and schema separation
        run: >-
          python -m pytest -q
          tests/test_hil_notification_delivery.py
          tests/test_hil_gateway_attempt_contract.py
          tests/test_hil_submission_status.py
          tests/test_hil_notification_schema.py
          tests/test_hil_submission_status_schema.py
          tests/test_hil_readiness_contract.py
          tests/test_hil_readiness_schema.py
          tests/test_hil_authority_evidence.py
          tests/test_hil_authority_evidence_schema.py
