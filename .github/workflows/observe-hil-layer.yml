name: Observe HIL layer

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/hil-layer-workboard.json'
      - 'scripts/observe_hil_layer.py'
      - '.github/workflows/observe-hil-layer.yml'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe layer and select exact next task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIL_LAYER_OBSERVATION_OUTPUT: reports/hil-layer-observation.json
        run: python scripts/observe_hil_layer.py
      - name: Upload machine-readable observation
        uses: actions/upload-artifact@v4
        with:
          name: hil-layer-observation
          path: reports/hil-layer-observation.json
          if-no-files-found: error
      - name: Update coordination issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/hil-layer-observation.json', 'utf8'));
            const marker = '<!-- HIL-LAYER-OBSERVER -->';
            const body = `${marker}\n## Automated HIL layer observation\n\n- State: \`${report.state}\`\n- Observed: \`${report.observed_at}\`\n- Next task: \`${report.next_task.id}\`\n- Location: \`${report.next_task.location}\`\n- Action: ${report.next_task.action}\n- External tasks: \`false\`\n- Authority effect: \`NONE\`\n\nArtifact: \`hil-layer-observation\` in workflow run ${context.runId}.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 92,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 92,
                body,
              });
            }
