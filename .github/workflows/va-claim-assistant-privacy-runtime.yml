name: VA Claim Assistant Privacy Runtime

on:
  push:
    branches: [main]
    paths:
      - 'va_claim_assistant/privacy_runtime.py'
      - 'va_claim_assistant/privacy_guarded_dispatch.py'
      - 'contracts/va-claim-assistant-privacy-runtime.schema.json'
      - 'tests/test_va_claim_assistant_privacy_runtime.py'
      - 'scripts/validate_va_claim_assistant_privacy_runtime.py'
      - 'tasks/VACP-ADAPTER-PII-RUNTIME-006.json'
      - 'docs/VA_CLAIM_ASSISTANT_PRIVACY_RUNTIME_MIRROR_HANDOFF.md'
      - '.github/workflows/va-claim-assistant-privacy-runtime.yml'
  pull_request:
    paths:
      - 'va_claim_assistant/privacy_runtime.py'
      - 'va_claim_assistant/privacy_guarded_dispatch.py'
      - 'contracts/va-claim-assistant-privacy-runtime.schema.json'
      - 'tests/test_va_claim_assistant_privacy_runtime.py'
      - 'scripts/validate_va_claim_assistant_privacy_runtime.py'
      - 'tasks/VACP-ADAPTER-PII-RUNTIME-006.json'
      - 'docs/VA_CLAIM_ASSISTANT_PRIVACY_RUNTIME_MIRROR_HANDOFF.md'
      - '.github/workflows/va-claim-assistant-privacy-runtime.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claim-assistant-privacy-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-privacy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute privacy-first runtime fixtures
        run: python tests/test_va_claim_assistant_privacy_runtime.py

      - name: Mark hosted observation provenance
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('receipts/va-claim-assistant-privacy-runtime-validation.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['observation_source'] = 'GITHUB_ACTIONS_WORKFLOW'
          material = {key: item for key, item in value.items() if key != 'receipt_hash'}
          value['receipt_hash'] = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f"hosted privacy receipt {value['receipt_hash']}")
          PY

      - name: Validate privacy receipt and source ordering
        run: python scripts/validate_va_claim_assistant_privacy_runtime.py

      - name: Persist privacy validation receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'va-claim-assistant[bot]'
          git config user.email 'va-claim-assistant[bot]@users.noreply.github.com'
          git add receipts/va-claim-assistant-privacy-runtime-validation.json
          if git diff --cached --quiet; then
            echo 'Privacy receipt unchanged.'
          else
            git commit -m 'receipt: persist VA privacy runtime evidence [skip ci]'
            git pull --rebase
            git push
          fi

      - name: Upload privacy runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-claim-assistant-privacy-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/va-claim-assistant-privacy-runtime-validation.json
            contracts/va-claim-assistant-privacy-runtime.schema.json
            tasks/VACP-ADAPTER-PII-RUNTIME-006.json
          if-no-files-found: error
          retention-days: 90
