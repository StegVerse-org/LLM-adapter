name: HIL InTr Double Interlock

on:
  pull_request:
    paths:
      - 'llm_adapter/hil_intr_interlock.py'
      - 'llm_adapter/hil_intake_v1_1_api.py'
      - 'tests/test_hil_intake_api.py'
      - 'tasks/LLMA-HIL-INTR-DOUBLE-INTERLOCK-031.json'
      - 'docs/HIL_INTR_DOUBLE_INTERLOCK_MIRROR_HANDOFF.md'
      - 'docs/HIL_RUNTIME_MIRROR_HANDOFF.md'
      - '.github/workflows/hil-intr-double-interlock.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY CLOUDFLARE_API_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:${key}"
              exit 1
            fi
          done
      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c credential.helper= -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install credential-free test dependencies
        run: python3 -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: Validate HIL Universal InTr Interlock contract
        run: |
          python3 -m pytest -q tests/test_hil_intake_api.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          task=json.loads(Path('tasks/LLMA-HIL-INTR-DOUBLE-INTERLOCK-031.json').read_text())
          assert task['credential_authority']=='TV/TVC'
          assert task['always_on_receiver_required'] is False
          assert task['github_token_runtime_authority']=='NONE'
          contract=task['source_contract']
          assert contract['universal_transport_schema']=='stegverse.universal-intr-transport/v1'
          assert contract['transport_protocol']=='InTr'
          assert contract['first_boundary']=='DEVICE_SYSTEM->STEGOS_ECOSYSTEM'
          assert contract['custody_receipt_prior_hash_binds_first'] is True
          assert contract['next_intent_prior_hash_binds_custody_receipt'] is True
          assert contract['receiver_may_claim_tvc_admission'] is False
          assert task['retry_contract']['same_operation_idempotent'] is True

          source=Path('llm_adapter/hil_intake_v1_1_api.py').read_text()
          helper=Path('llm_adapter/hil_intr_interlock.py').read_text()
          for marker in (
              'intr_transport_intent: UploadFile = File(...)',
              'validate_ingress_intent',
              'device_ingress_receipt = build_hop_receipt',
              'custody_intent = build_universal_intent',
              'next_intent = build_universal_intent',
              'HIL_CUSTODY_TVC_INTERLOCK_ADMISSION',
              '_submission_by_intr_operation',
              '_persisted_receiver_receipt',
          ):
              assert marker in source, marker
          for marker in (
              'UNIVERSAL_INTR_SCHEMA = "stegverse.universal-intr-transport/v1"',
              'CHAIN_SCHEMA = "stegverse.hil.intr_receipt_chain/v2"',
              'prior_transport_receipt_hash',
              'DURABLE_QUEUE_OR_EVENT_EPHEMERAL_MATERIALIZATION',
          ):
              assert marker in helper, marker
          print('HIL_INTR_DOUBLE_INTERLOCK=PASS')
          print('TRANSPORT_PROTOCOL=InTr')
          print('UNIVERSAL_TRANSPORT=stegverse.universal-intr-transport/v1')
          print('ALWAYS_ON_RECEIVER_REQUIRED=false')
          print('TVC_ADMISSION_CLAIMED=false')
          print('AUTHORITY_EFFECT=NONE')
          PY
