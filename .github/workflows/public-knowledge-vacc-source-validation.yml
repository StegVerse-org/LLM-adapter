name: Public Knowledge and VACC Source Validation

on:
  push:
    paths:
      - "data/stegverse-public-knowledge.v1.json"
      - "llm_adapter/public_knowledge.py"
      - "llm_adapter/ai_entry_backend_service.py"
      - "tests/test_public_knowledge.py"
      - "profiles/vacc-public-information-llm.v1.json"
      - "llm_adapter/vacc_public_information.py"
      - "tests/test_vacc_public_information.py"
      - "docs/ECOSYSTEM_PUBLIC_KNOWLEDGE_MIRROR_HANDOFF.md"
      - "docs/VACC_PUBLIC_INFORMATION_PROFILE_MIRROR_HANDOFF.md"
      - "tasks/LLMA-ECOSYSTEM-PUBLIC-KNOWLEDGE-021.json"
      - "tasks/LLMA-VACC-PUBLIC-INFORMATION-PROFILE-022.json"
      - ".github/workflows/public-knowledge-vacc-source-validation.yml"
  pull_request:
    paths:
      - "data/stegverse-public-knowledge.v1.json"
      - "llm_adapter/public_knowledge.py"
      - "llm_adapter/ai_entry_backend_service.py"
      - "tests/test_public_knowledge.py"
      - "profiles/vacc-public-information-llm.v1.json"
      - "llm_adapter/vacc_public_information.py"
      - "tests/test_vacc_public_information.py"
      - ".github/workflows/public-knowledge-vacc-source-validation.yml"

permissions: {}

jobs:
  credential-free-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert no GitHub credential is provided to validation
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
      - name: Materialize exact public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Compile new source surfaces
        run: |
          set -eu
          cd /tmp/source
          python -m py_compile \
            llm_adapter/public_knowledge.py \
            llm_adapter/ai_entry_backend_service.py \
            llm_adapter/vacc_public_information.py \
            tests/test_public_knowledge.py \
            tests/test_vacc_public_information.py
      - name: Execute focused credential-free tests
        run: |
          set -eu
          cd /tmp/source
          python -m unittest -q tests.test_public_knowledge tests.test_vacc_public_information
          echo PUBLIC_KNOWLEDGE_VACC_SOURCE_VALIDATION_PASS
