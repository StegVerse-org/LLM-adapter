name: Validate AI Entity Coordination Ingress

on:
  pull_request:
    paths:
      - 'llm_adapter/ai_entity_coordination_ingress.py'
      - 'schemas/ai-entity-coordination-ingress.schema.json'
      - 'tests/test_ai_entity_coordination_ingress.py'
      - 'docs/AI_ENTITY_COORDINATION_INGRESS_MIRROR_HANDOFF.md'
      - 'tasks/LLMA-AI-ENTITY-COORDINATION-INGRESS-282.json'
      - 'data/preflight/LLMA-AI-ENTITY-COORDINATION-INGRESS-282-20260906.json'
      - 'adapter.capabilities.json'
      - 'README.md'
      - '.github/workflows/validate-ai-entity-coordination.yml'
  push:
    branches: [main]
    paths:
      - 'llm_adapter/ai_entity_coordination_ingress.py'
      - 'schemas/ai-entity-coordination-ingress.schema.json'
      - 'tests/test_ai_entity_coordination_ingress.py'
      - 'adapter.capabilities.json'
      - '.github/workflows/validate-ai-entity-coordination.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN TVC_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN ZAI_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment: ${name}" >&2
              exit 1
            fi
          done

      - name: Fetch exact pull request source anonymously
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz -C source --strip-components=1

      - name: Fetch exact pushed source anonymously
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz -C source --strip-components=1

      - name: Install test dependencies
        working-directory: source
        run: python -m pip install -e '.[dev]'

      - name: Validate coordination ingress
        working-directory: source
        run: pytest tests/test_ai_entity_coordination_ingress.py -q

      - name: Validate schema and capability declaration
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('schemas/ai-entity-coordination-ingress.schema.json').read_text())
          caps = json.loads(Path('adapter.capabilities.json').read_text())
          assert schema['properties']['entry_point']['const'] == 'ecosystem_chat'
          lane = caps['ai_entity_coordination_ingress']
          assert lane['same_entry_point_as_chatgpt'] is True
          assert lane['external_ecosystem_mutation_authority'] is False
          assert lane['implementation_actor'] == 'chatgpt'
          assert lane['requires_intr_admission_for_implementation'] is True
          assert lane['creates_new_governance_engine'] is False
          print('AI entity coordination authority checks: PASS')
          PY
