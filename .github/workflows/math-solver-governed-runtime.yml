name: Math Solver Governed Runtime

on:
  push:
    branches: [main]
    paths:
      - "llm_adapter/math_solver_gateway.py"
      - "llm_adapter/steggate_portable_consumer.py"
      - "tests/test_math_solver_gateway.py"
      - "pyproject.toml"
      - ".github/workflows/math-solver-governed-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gateway and canonical StegCore
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,service]"
          python -m pip install "git+https://github.com/StegVerse-Labs/StegCore.git@819884022b32e283ac36eddbab97a2b9ecebc874"
      - name: Execute governed Math Solver tests
        run: python -m pytest -q tests/test_math_solver_gateway.py
      - name: Emit deterministic governed execution evidence
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from llm_adapter.math_solver_gateway import governed_solve
          from stegcore.portable_steggate import runtime_fingerprint

          first = governed_solve("6 * 7", request_id="MATH-CI-42-A")
          replay = governed_solve("6 * 7", request_id="MATH-CI-42-B")
          evidence = {
              "schema_version": "MATH-SOLVER-STEGGATE-INTEGRATION-v1",
              "stegcore_commit": "819884022b32e283ac36eddbab97a2b9ecebc874",
              "runtime_fingerprint": runtime_fingerprint(),
              "first": first,
              "replay": replay,
              "request_hash_replay_match": first["request_hash"] == replay["request_hash"],
              "result_hash_replay_match": first["result_hash"] == replay["result_hash"],
              "canonical_steggate_preexecution": first["disposition"] == "ALLOW" and first["executor_invoked"] is True,
              "status": "PASS",
              "authority_effect": False,
              "public_deployment_proven": False,
          }
          assert evidence["request_hash_replay_match"]
          assert evidence["result_hash_replay_match"]
          assert evidence["canonical_steggate_preexecution"]
          Path("artifacts/math-solver-steggate-integration.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: math-solver-steggate-integration
          path: artifacts/math-solver-steggate-integration.json
          if-no-files-found: error
          retention-days: 90
