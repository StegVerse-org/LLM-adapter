name: HIL HTTPS Receiver Probe Contract

on:
  push:
    paths:
      - "scripts/probe_hil_https_receiver.py"
      - "tests/test_hil_https_receiver_probe.py"
      - ".github/workflows/hil-https-receiver-probe.yml"
      - ".github/workflows/hil-https-receiver-probe-contract.yml"
  pull_request:
    paths:
      - "scripts/probe_hil_https_receiver.py"
      - "tests/test_hil_https_receiver_probe.py"
      - ".github/workflows/hil-https-receiver-probe.yml"
      - ".github/workflows/hil-https-receiver-probe-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify origin-bound fail-closed probe behavior
        run: python -m pytest tests/test_hil_https_receiver_probe.py -v
