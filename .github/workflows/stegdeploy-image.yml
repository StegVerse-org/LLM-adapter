name: StegDeploy image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - llm_adapter/**
      - scripts/container-entrypoint.sh
      - compose.stegdeploy.yaml
      - .github/workflows/stegdeploy-image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write publication receipt
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p receipts
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          body = {
              "schema": "stegdeploy.image-publication.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}",
              "digest": os.environ["IMAGE_DIGEST"],
              "published_by_workflow": os.environ["GITHUB_WORKFLOW"],
              "publication_run_id": os.environ["GITHUB_RUN_ID"],
              "publication_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository_retained": True,
              "package_visibility_asserted": False,
              "manual_credentials_required": False,
              "authority_effect": "IMAGE_PUBLICATION_ONLY",
          }
          canonical = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
          body["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("receipts/stegdeploy-image-publication.json").write_text(json.dumps(body, indent=2, sort_keys=True) + "\n")
          PY

      - name: Retain publication receipt on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/stegdeploy-image-publication.json
          if git diff --cached --quiet; then
            echo "Canonical image publication receipt unchanged."
          else
            git commit -m "chore: retain canonical StegDeploy image publication receipt [skip ci]"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stegdeploy-image-publication-${{ github.run_id }}
          path: receipts/stegdeploy-image-publication.json
          retention-days: 90
