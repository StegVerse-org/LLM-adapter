name: LLM-adapter Organization Ledger Main Merge Transfer (G-8 draft, plan only, fails closed)

# Adapted from StegVerse-org/.github .github/workflows/organization-ledger-merge-transfer.yml
# (pinned in .stegverse/transition-ledger/merge-transfer-writer-pin.v1.json).
# This repository's chain is the subtree repository-ledger/StegVerse-org/LLM-adapter of
# StegVerse-org/.github refs/stegverse/organization-ledger (.stegverse/transition-ledger/contract.json).
# Publishing that ref is the organization's own append, so this workflow only PLANS. It reads the
# public ref anonymously, verifies the pinned writer, builds the merge evidence, and ends FAIL_CLOSED
# with six fields until genesis and an admitted append path are observed.
# It has contents: read, no publish step, no credential, no dispatch and no schedule.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: llm-adapter-organization-ledger-merge-transfer
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout LLM-adapter
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the pinned organization writer (read-only)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: StegVerse-org/.github
          ref: 907f4305ddd4f39b16d96638744304de9ef0b67d
          path: org-writer
          persist-credentials: false

      - name: Read the organization ledger ref (anonymous, read-only copy)
        run: |
          set -euo pipefail
          git init -q --bare "$RUNNER_TEMP/org-ledger.git"
          git --git-dir="$RUNNER_TEMP/org-ledger.git" fetch -q --no-tags \
            https://github.com/StegVerse-org/.github.git "+$LEDGER_REF:$LEDGER_REF" || echo "ledger ref not readable; the plan fails closed"

      - name: Select the commits this push carries
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "$GITHUB_SHA" > "$RUNNER_TEMP/commits.txt"
          else
            git rev-list --first-parent --reverse "$BEFORE..$GITHUB_SHA" > "$RUNNER_TEMP/commits.txt"
          fi
          cat "$RUNNER_TEMP/commits.txt"

      - name: Plan the merge-transfer receipts (no write; FAIL_CLOSED with six fields until admitted)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          python3 scripts/llm_adapter_ledger_merge_transfer.py plan --commits-file "$RUNNER_TEMP/commits.txt" \
            --org-ledger "$RUNNER_TEMP/org-ledger.git" --writer-checkout org-writer \
            --out "$RUNNER_TEMP/plan.json" > /dev/null && rc=0 || rc=$?
          { echo '### LLM-adapter merge transfer plan'; echo '```json'; cat "$RUNNER_TEMP/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['disposition'], d['failure_code'], json.dumps({k: d[k] for k in ('failed_predicate','required_evidence_or_repair','retry_entrypoint','owning_existing_goal','next_attempt')}))" "$RUNNER_TEMP/plan.json"
          exit "$rc"
