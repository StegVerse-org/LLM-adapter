name: LLM-adapter Ledger Merge Transfer Onboarding - Validation Only / No Ledger Write

# Deterministic tests for scripts/llm_adapter_ledger_merge_transfer.py and the
# REPOSITORY_LEDGER_GENESIS_PIN planner (scripts/llm_adapter_repository_ledger_genesis_pin.py) and its
# pre-pin InTr ingress receiver (scripts/llm_adapter_genesis_pin_ingress.py) against temporary local
# repositories and ledgers. Never fetches, appends to or pushes any ledger ref.
on:
  pull_request:
    paths:
      - ".stegverse/transition-ledger/**"
      - "scripts/llm_adapter_ledger_merge_transfer.py"
      - "scripts/llm_adapter_repository_ledger_genesis_pin.py"
      - "scripts/llm_adapter_genesis_pin_ingress.py"
      - "llm_adapter/intr_transport_carrier.py"
      - "tests/test_llm_adapter_ledger_merge_transfer.py"
      - "tests/fixtures/org-intr-path-transfer/**"
      - ".github/workflows/llm-adapter-organization-ledger-merge-transfer.yml"
      - ".github/workflows/llm-adapter-ledger-merge-transfer-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Run deterministic tests (stdlib only, no token, no network; 0 skipped required)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/llm_adapter_ledger_merge_transfer.py scripts/llm_adapter_repository_ledger_genesis_pin.py scripts/llm_adapter_genesis_pin_ingress.py llm_adapter/intr_transport_carrier.py tests/test_llm_adapter_ledger_merge_transfer.py
          python3 - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_llm_adapter_ledger_merge_transfer")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"ran={result.testsRun} failures={len(result.failures)} errors={len(result.errors)} skipped={len(result.skipped)}")
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun > 0 else 1)
          PY
