name: HIL Live Activation

on:
  push:
    branches: [main]
    paths:
      - 'llm_adapter/hil_intake_v1_1_api.py'
      - 'llm_adapter/combined_gateway.py'
      - 'render.yaml'
      - '.github/workflows/hil-live-activation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  observe-live-runtime:
    runs-on: ubuntu-latest
    env:
      HIL_RUNTIME_BASE_URL: https://stegverse-ecosystem-chat-gateway.onrender.com
      EXPECTED_PRIMARY_SHA256: a7b1c62e336b4e244ecf7fdcd10af195401f6c44328de32615b073d2a5c3c462
      EXPECTED_PROMPT_SHA256: cdff8d2266bb3eefbb6e5d28d9adc548e6c8dfc039debd72fe404f1d0249912c
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment and capture readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          state="UNREACHABLE"
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o artifacts/readiness.json -w '%{http_code}' \
              "$HIL_RUNTIME_BASE_URL/api/hil/readiness" || true)
            if [ "$code" = "200" ]; then
              state="RESPONDED"
              break
            fi
            sleep 20
          done
          python - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path('artifacts/readiness.json')
          if not path.exists():
              result = {'state':'UNREACHABLE','authority_granted':False}
              pathlib.Path('artifacts/hil-live-activation.json').write_text(json.dumps(result, indent=2)+'\n')
              raise SystemExit('HIL runtime did not become reachable')
          payload = json.loads(path.read_text())
          expected_primary = os.environ['EXPECTED_PRIMARY_SHA256']
          expected_prompt = os.environ['EXPECTED_PROMPT_SHA256']
          checks = {
              'state_ready': payload.get('state') == 'READY',
              'primary_match': payload.get('primary_sha256') == expected_primary,
              'prompt_match': payload.get('prompt_sha256') == expected_prompt,
              'provenance_required': payload.get('provenance_manifest_required') is True,
          }
          result = {
              'schema_version':'HIL-LIVE-ACTIVATION-OBSERVATION-v1',
              'runtime':os.environ['HIL_RUNTIME_BASE_URL'],
              'readiness':payload,
              'checks':checks,
              'activation_state':'READY_FOR_CONTROLLED_SUBMISSION' if all(checks.values()) else 'BLOCKED',
              'authority_granted':False,
          }
          pathlib.Path('artifacts/hil-live-activation.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          if not all(checks.values()):
              raise SystemExit('Live HIL runtime is not ready for controlled submission')
          PY

      - name: Upload activation observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-live-activation-observation
          path: artifacts/
