name: VA Claim Assistant Governed Retrieval

on:
  push:
    branches: [main]
    paths:
      - 'va_claim_assistant/**'
      - 'tests/fixtures/va_claim_assistant_source_registry.projection.json'
      - 'tests/test_va_claim_assistant_governed_retrieval.py'
      - 'tests/test_va_claim_assistant_route_classifier.py'
      - 'tests/test_va_claim_assistant_route_generators.py'
      - 'tests/test_va_claim_assistant_governed_dispatch.py'
      - '.github/workflows/va-claim-assistant-governed-retrieval.yml'
  pull_request:
    paths:
      - 'va_claim_assistant/**'
      - 'tests/fixtures/va_claim_assistant_source_registry.projection.json'
      - 'tests/test_va_claim_assistant_governed_retrieval.py'
      - 'tests/test_va_claim_assistant_route_classifier.py'
      - 'tests/test_va_claim_assistant_route_generators.py'
      - 'tests/test_va_claim_assistant_governed_dispatch.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claim-assistant-governed-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-governed-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute deterministic route-classifier fixtures
        run: python tests/test_va_claim_assistant_route_classifier.py

      - name: Execute deterministic route-generator fixtures
        run: python tests/test_va_claim_assistant_route_generators.py

      - name: Execute deterministic governed retrieval fixture
        run: python tests/test_va_claim_assistant_governed_retrieval.py

      - name: Execute deterministic governed dispatch fixtures
        run: python tests/test_va_claim_assistant_governed_dispatch.py

      - name: Verify secret-free hash-bound receipts
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def load_and_verify(path):
              value = json.loads(Path(path).read_text())
              material = dict(value)
              expected = material.pop('receipt_hash')
              actual = hashlib.sha256(
                  json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
              ).hexdigest()
              assert expected == actual, f'{path}: receipt hash mismatch'
              return value

          retrieval = load_and_verify('receipts/va-claim-assistant-public-source-fixture.json')
          assert retrieval['route'] == 'evidence_requirement'
          assert retrieval['capability_state'] == 'SOURCE_GROUNDED_ASSISTANT'
          assert not any(retrieval['authority_flags'].values())
          assert 'contract_refs' not in retrieval

          classifier = load_and_verify('receipts/va-claim-assistant-route-classifier-validation.json')
          assert classifier['result'] == 'PASS'
          assert classifier['ambiguous_state'] == 'REVIEW_REQUIRED'
          assert classifier['unsupported_state'] == 'REVIEW_REQUIRED'
          assert classifier['urgent_route'] == 'urgent_safety'
          assert classifier['authority_granted'] is False

          generators = load_and_verify('receipts/va-claim-assistant-route-generators-validation.json')
          assert generators['result'] == 'PASS'
          assert generators['source_registry_commit'] == 'e69e8421084b1343a9dc809fdb2a579089d37813'
          assert generators['source_registry_blob_sha'] == 'a83ff2dd8343f947265981609b154693cc5deecc'
          assert generators['answer_ready_public_routes'] == sorted([
              'claim_type',
              'evidence_requirement',
              'service_connection',
              'rating_criteria',
              'effective_date',
              'appeal_or_supplemental_claim',
              'cp_examination',
              'lay_statement',
              'private_record_collection',
              'procedural_filing',
              'representation_referral',
          ])
          assert generators['document_route_generator'] == 'PASS_WITH_SANITIZED_DERIVED_CONTEXT'
          assert generators['urgent_safety_route'] == 'AUTHORITY_RESOLUTION_REQUIRED'
          assert generators['urgent_safety_missing_source'] == 'VA-CRISIS-LINE'
          assert generators['raw_document_and_direct_identifier_rejection'] is True
          assert generators['site_answer_schema_additional_properties_rejected'] is True
          assert generators['authority_granted'] is False
          assert generators['activation_granted'] is False

          dispatch = load_and_verify('receipts/va-claim-assistant-governed-dispatch-validation.json')
          assert dispatch['result'] == 'PASS'
          assert dispatch['states_verified'] == [
              'ANSWER_READY_PENDING_TVC_AND_CUSTODY',
              'DOCUMENT_CONTEXT_REQUIRED',
              'AUTHORITY_RESOLUTION_REQUIRED',
              'REVIEW_REQUIRED',
          ]
          assert dispatch['implemented_route_generators'] == [
              'claim_type',
              'evidence_requirement',
              'service_connection',
              'rating_criteria',
              'effective_date',
              'appeal_or_supplemental_claim',
              'cp_examination',
              'document_organization',
              'lay_statement',
              'private_record_collection',
              'procedural_filing',
              'representation_referral',
              'urgent_safety',
          ]
          assert dispatch['document_route_answer_ready_with_sanitized_context'] is True
          assert dispatch['document_route_missing_context_fails_closed'] is True
          assert dispatch['privacy_boundary_rejection_verified'] is True
          assert dispatch['urgent_safety_authority_resolution_required'] is True
          assert dispatch['authority_granted'] is False
          assert dispatch['activation_granted'] is False
          print('secret-free VA classifier, route generators, retrieval, and dispatch receipts: PASS')
          PY

      - name: Persist receipts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'va-claim-assistant[bot]'
          git config user.email 'va-claim-assistant[bot]@users.noreply.github.com'
          git add \
            receipts/va-claim-assistant-public-source-fixture.json \
            receipts/va-claim-assistant-route-classifier-validation.json \
            receipts/va-claim-assistant-route-generators-validation.json \
            receipts/va-claim-assistant-governed-dispatch-validation.json
          if git diff --cached --quiet; then
            echo 'Receipts unchanged.'
          else
            git commit -m 'receipt: persist expanded VA governed route validation [skip ci]'
            git pull --rebase
            git push
          fi

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-claim-assistant-governed-retrieval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/va-claim-assistant-public-source-fixture.json
            receipts/va-claim-assistant-route-classifier-validation.json
            receipts/va-claim-assistant-route-generators-validation.json
            receipts/va-claim-assistant-governed-dispatch-validation.json
          if-no-files-found: error
          retention-days: 30
