name: Exceed Federal Security Baseline

on:
  push:
    paths:
      - 'data/security/exceed-federal-baseline.json'
      - 'scripts/check_exceed_federal_security_baseline.py'
      - '.github/workflows/exceed-federal-security-baseline.yml'
      - 'docs/LLM_ADAPTER_MIRROR_HANDOFF.md'
  pull_request:
    paths:
      - 'data/security/exceed-federal-baseline.json'
      - 'scripts/check_exceed_federal_security_baseline.py'
      - '.github/workflows/exceed-federal-security-baseline.yml'
      - 'docs/LLM_ADAPTER_MIRROR_HANDOFF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exceed-federal security contract
        run: python scripts/check_exceed_federal_security_baseline.py
