name: Ecosystem Chat Live Activation Monitor

on:
  push:
    paths:
      - '.github/workflows/ecosystem-chat-live-activation-monitor.yml'
      - 'scripts/write_live_activation_monitor_status.py'
      - 'scripts/write_live_activation_status.py'
  workflow_run:
    workflows:
      - Ecosystem Chat Live Activation
    types:
      - completed
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-chat-live-activation-monitor
  cancel-in-progress: false

jobs:
  record-monitor-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out adapter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record hash-bound monitor heartbeat
        run: python scripts/write_live_activation_monitor_status.py

      - name: Validate monitor heartbeat
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('reports/ecosystem-chat-live-activation-monitor.json')
          value = json.loads(path.read_text())
          assert value['schema'] == 'stegverse.ecosystem_chat.live_activation_monitor.v1'
          assert value['semantic_state'] in {'PENDING', 'VERIFIED'}
          assert isinstance(value['semantic_blockers'], list)
          assert value['manual_user_action_required'] is False
          assert all(flag is False for flag in value['authority_boundary'].values())
          material = dict(value)
          expected = material.pop('monitor_sha256')
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          assert expected == actual
          print(f"validated monitor heartbeat: {value['semantic_state']}")
          PY

      # Heartbeats are intentionally volatile execution evidence. Persisting a new
      # timestamp/run-id commit every 15 minutes caused the deployment platform to
      # rebuild current main even when runtime code and semantic activation state
      # were unchanged. Semantic state continues to be retained by the activation
      # workflow; every heartbeat remains inspectable as a workflow artifact.
      - name: Upload monitor evidence
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-chat-live-activation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ecosystem-chat-live-activation-monitor.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize monitor posture
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          value = json.loads(Path('reports/ecosystem-chat-live-activation-monitor.json').read_text())
          print('## Ecosystem Chat Activation Monitor')
          print(f"Semantic state: {value['semantic_state']}")
          print(f"Blockers: {', '.join(value['semantic_blockers']) or 'none'}")
          print(f"Next machine action: {value['next_machine_action']}")
          print(f"Monitor SHA-256: {value['monitor_sha256']}")
          print('Persistence: workflow artifact only; semantic state is retained separately')
          print('Authority granted: false')
          PY
