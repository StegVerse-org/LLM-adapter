name: Validate Chat Session Binding

on:
  pull_request:
    paths:
      - "llm_adapter/chat_profiles.py"
      - "llm_adapter/chat_session_binding.py"
      - "profiles/ecosystem-chat-llm.v1.json"
      - "profiles/va-claims-chat-llm.v1.json"
      - "contracts/chat-llm-session-envelope.schema.json"
      - "tests/test_chat_session_binding.py"
      - "scripts/verify_chat_session_binding.py"
      - "docs/CHAT_LLM_SESSION_BINDING_MIRROR_HANDOFF.md"
      - "tasks/LLMA-CHAT-SESSION-BINDING-010.json"
      - ".github/workflows/validate-chat-session-binding.yml"
  push:
    branches:
      - main
    paths:
      - "llm_adapter/chat_profiles.py"
      - "llm_adapter/chat_session_binding.py"
      - "profiles/ecosystem-chat-llm.v1.json"
      - "profiles/va-claims-chat-llm.v1.json"
      - "contracts/chat-llm-session-envelope.schema.json"
      - "tests/test_chat_session_binding.py"
      - "scripts/verify_chat_session_binding.py"
      - "docs/CHAT_LLM_SESSION_BINDING_MIRROR_HANDOFF.md"
      - "tasks/LLMA-CHAT-SESSION-BINDING-010.json"
      - ".github/workflows/validate-chat-session-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-chat-session-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run session-binding tests
        run: python -m pytest tests/test_chat_session_binding.py -q

      - name: Build deterministic validation receipt
        run: python scripts/verify_chat_session_binding.py --write-receipt

      - name: Upload validation receipt
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: chat-llm-session-binding-validation
          path: receipts/chat-llm-session-binding-validation.json
          if-no-files-found: error
          retention-days: 30
