name: validate-objective-contract

on:
  push:
    branches: [main]
    paths:
      - 'data/autonomy/objective-contract.json'
      - 'scripts/validate_objective_contract.py'
      - '.github/workflows/validate-objective-contract.yml'
  pull_request:
    paths:
      - 'data/autonomy/objective-contract.json'
      - 'scripts/validate_objective_contract.py'
      - '.github/workflows/validate-objective-contract.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

jobs:
  validate-objective-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate outcome-level objective contract
        run: python scripts/validate_objective_contract.py
