name: Validate Provider-Owned Usage Event

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile validator
        run: python -m compileall -q scripts tests
      - name: Validate canonical provider event
        run: python scripts/verify_provider_usage_event.py
      - name: Run adversarial tests
        run: python -m pytest -q tests/test_provider_usage_event.py
