name: HIL Compatibility Validation

on:
  pull_request:
    paths:
      - "docs/HIL_DEPLOYMENT_PROFILE.md"
      - "scripts/verify_hil_deployment_profile.py"
      - "scripts/check_hil_storage_consistency.py"
      - "scripts/probe_hil_https_receiver.py"
      - "scripts/verify_hil_deployed_cycle_evidence.py"
      - "scripts/verify_hil_full_cycle_artifact.py"
      - "llm_adapter/hil_*.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - ".github/workflows/hil-deployment-profile.yml"
  push:
    branches: [main]
    paths:
      - "docs/HIL_DEPLOYMENT_PROFILE.md"
      - "scripts/verify_hil_deployment_profile.py"
      - "scripts/check_hil_storage_consistency.py"
      - "scripts/probe_hil_https_receiver.py"
      - "scripts/verify_hil_deployed_cycle_evidence.py"
      - "scripts/verify_hil_full_cycle_artifact.py"
      - "llm_adapter/hil_*.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - ".github/workflows/hil-deployment-profile.yml"
  workflow_dispatch:

permissions: {}

jobs:
  validate-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:$key"
              exit 1
            fi
          done

      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install validation dependencies
        run: python3 -m pip install -e ".[dev,service]"

      - name: Verify fail-closed HIL compatibility profile
        run: python3 scripts/verify_hil_deployment_profile.py

      - name: Test fail-closed HIL storage consistency
        run: python3 -m pytest tests/test_hil_storage_consistency.py -v

      - name: Verify HTTPS receiver probe contract
        run: python3 -m pytest tests/test_hil_https_receiver_probe.py -v

      - name: Run deterministic controlled-cycle compatibility tests
        run: |
          python3 -m pytest -q \
            tests/test_hil_intake_api.py \
            tests/test_hil_provenance_chain.py \
            tests/test_hil_publication_api.py \
            tests/test_hil_controlled_cycle.py

      - name: Verify bounded full-cycle artifact contract
        shell: bash
        run: |
          rm -rf .hil-artifact-fixture .hil-artifact-contaminated
          mkdir -p .hil-artifact-fixture reports
          printf 'first gateway log\n' > .hil-artifact-fixture/gateway-first.log
          printf 'restart gateway log\n' > .hil-artifact-fixture/gateway-restart.log
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = {
              "schema_version": "HIL-AUTOMATED-FULL-CYCLE-RECEIPT-v1",
              "observation_scope": "GITHUB_HOSTED_EPHEMERAL_FULL_CYCLE_PROOF",
              "readiness_before_restart": "READY",
              "readiness_after_restart": "READY",
              "actual_process_restart": True,
              "exact_response_bytes_persisted": True,
              "provenance_manifest_persisted": True,
              "accept_private_completed": True,
              "append_only_publication_completed": True,
              "stable_public_lookup_completed": True,
              "durable_counts": {"submissions": 1, "reviews": 1, "publications": 1},
              "external_production_deployment_claimed": False,
              "master_record_release_claimed": False,
              "orchestration_authority_granted": False,
              "authority_effect": "NONE"
          }
          receipt["receipt_sha256"] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          Path(".hil-artifact-fixture/hil-automated-full-cycle-receipt-v1.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          python3 scripts/verify_hil_full_cycle_artifact.py .hil-artifact-fixture --output reports/hil-full-cycle-artifact-verification.json
          cp -R .hil-artifact-fixture .hil-artifact-contaminated
          printf '{}\n' > .hil-artifact-contaminated/ecosystem-chat-live-activation-status.json
          if python3 scripts/verify_hil_full_cycle_artifact.py .hil-artifact-contaminated; then
            echo "contaminated bundle unexpectedly passed" >&2
            exit 1
          fi

      - name: Verify deployed-cycle evidence contract
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import hashlib, json
          evidence = {
            "schema_version":"HIL-DEPLOYED-CYCLE-EVIDENCE-v1",
            "observation_scope":"DEPLOYED_CONTROLLED_CYCLE",
            "storage_scope":"EXTERNAL_DURABLE_SERVICE",
            "receiver_origin":"https://receiver.example",
            "primary_version":"v1.1",
            "primary_sha256":"a7b1c62e336b4e244ecf7fdcd10af195401f6c44328de32615b073d2a5c3c462",
            "protocol_version":"HIL-PROTOCOL-v1.1",
            "prompt_version":"HIL-PROMPT-v1.1",
            "prompt_sha256":"cdff8d2266bb3eefbb6e5d28d9adc548e6c8dfc039debd72fe404f1d0249912c",
            "provenance_schema":"HIL-RESPONSE-PROVENANCE-v1.1",
            "receipt_schema":"HIL-RECEIVER-RECEIPT-v2",
            "submission_id":"submission-1",
            "response_id":"HIL-RESP-CONTROLLED-0001",
            "response_sha256":"1"*64,
            "provenance_manifest_sha256":"2"*64,
            "receiver_receipt_sha256":"3"*64,
            "private_review_receipt_sha256":"4"*64,
            "publication_record_sha256":"5"*64,
            "readiness_probe_sha256":"6"*64,
            "readiness_before_upload":"READY",
            "readiness_after_restart":"READY",
            "controlled_upload_completed":True,
            "exact_response_bytes_persisted":True,
            "provenance_manifest_persisted":True,
            "actual_service_restart_or_replacement":True,
            "private_review_decision":"ACCEPT_PRIVATE",
            "append_only_publication_state":"PUBLISHED_APPEND_ONLY",
            "stable_public_lookup_completed":True,
            "site_import_completed":False,
            "master_record_release_completed":False,
            "execution_authority":False,
            "publication_authority_granted_by_evidence":False,
            "master_record_append_authority_granted_by_evidence":False,
            "authority_effect":"NONE"
          }
          evidence["evidence_sha256"] = hashlib.sha256(json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          open("reports/hil-deployed-cycle-evidence.json","w",encoding="utf-8").write(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY
          python3 scripts/verify_hil_deployed_cycle_evidence.py
          python3 - <<'PY'
          import json
          p="reports/hil-deployed-cycle-evidence.json"
          e=json.load(open(p,encoding="utf-8")); e["storage_scope"]="GITHUB_HOSTED_EPHEMERAL_FULL_CYCLE_PROOF"
          open(p,"w",encoding="utf-8").write(json.dumps(e,indent=2,sort_keys=True)+"\n")
          PY
          if python3 scripts/verify_hil_deployed_cycle_evidence.py; then
            echo "ephemeral deployed evidence unexpectedly passed" >&2
            exit 1
          fi

      - name: Confirm non-authorizing compatibility scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          handoff = Path('docs/HIL_LLM_ADAPTER_MIRROR_HANDOFF.md').read_text(encoding='utf-8')
          assert 'credential_authority: TV/TVC' in handoff
          assert 'github_token_runtime_authority: NONE' in handoff
          assert 'MERGED INTO: StegVerse-Labs/TVC/docs/HIL_TVC_MIRROR_HANDOFF.md' in handoff
          print('HIL_COMPATIBILITY_AUTHORITY=NONE')
          PY
