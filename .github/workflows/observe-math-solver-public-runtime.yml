name: Observe Math Solver Public Runtime

on:
  push:
    branches: [main]
    paths:
      - "llm_adapter/math_solver_gateway.py"
      - "llm_adapter/deployed_gateway.py"
      - "scripts/observe_math_solver_public_runtime.py"
      - ".github/workflows/observe-math-solver-public-runtime.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: write

concurrency:
  group: observe-math-solver-public-runtime
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observe public governed runtime fail-closed
        run: python scripts/observe_math_solver_public_runtime.py
      - name: Commit durable observation state
        run: |
          if [ -z "$(git status --porcelain -- receipts/math-solver-public-runtime.latest.json)" ]; then
            echo 'No Math Solver runtime observation change.'
            exit 0
          fi
          git config user.name 'stegverse-math-runtime-observer[bot]'
          git config user.email 'stegverse-math-runtime-observer[bot]@users.noreply.github.com'
          git add receipts/math-solver-public-runtime.latest.json
          git commit -m 'Observe Math Solver public runtime [skip ci]'
          git push
      - name: Preserve observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-solver-public-runtime-observation
          path: receipts/math-solver-public-runtime.latest.json
          if-no-files-found: error
          retention-days: 30
