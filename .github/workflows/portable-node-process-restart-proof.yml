name: Portable Node Process Restart Proof

on:
  pull_request:
    paths:
      - "tests/test_portable_node_process_restart.py"
      - "scripts/verify_goal4_full.py"
      - ".github/workflows/portable-node-process-restart-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" pydantic pytest httpx
      - name: Run real process restart proof
        run: python -m pytest tests/test_portable_node_process_restart.py -vv -s
