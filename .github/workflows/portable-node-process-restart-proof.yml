name: Portable Node Process Restart Proof

on:
  pull_request:
    paths:
      - "tests/test_portable_node_process_restart.py"
      - "scripts/verify_goal4_full.py"
      - ".github/workflows/portable-node-process-restart-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" pydantic pytest httpx python-multipart
      - name: Run real process restart proof
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_portable_node_process_restart.py -vv -s 2>&1 | tee portable-node-process-restart-proof.log
      - name: Retain focused failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-node-process-restart-proof-${{ github.run_id }}
          path: portable-node-process-restart-proof.log
          if-no-files-found: error
          retention-days: 90
