name: StegGate Portable Consumer Integration

on:
  push:
    branches: [main]
    paths:
      - "llm_adapter/steggate_portable_consumer.py"
      - "tests/test_steggate_portable_consumer.py"
      - "pyproject.toml"
      - ".github/workflows/steggate-portable-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-steggate-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout LLM adapter
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install consumer and canonical StegCore identity contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "git+https://github.com/StegVerse-Labs/StegCore.git@8c484e584d60a3bd2763d6948d0eb3f4afd67e0c"
          python -m pip install pytest

      - name: Verify portable governed-package consumer
        run: python -m pytest -q tests/test_steggate_portable_consumer.py

      - name: Emit integration receipt
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          from llm_adapter.steggate_portable_consumer import canonical_runtime_identity
          from stegcore.portable_steggate import runtime_fingerprint

          identity = canonical_runtime_identity()
          record = {
              "schema_version": "ECOSYSTEM-CHAT-STEGGATE-PORTABLE-CONSUMER-v2",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "consumer": "StegVerse-org/LLM-adapter",
              "application": "Ecosystem Chat",
              "stegcore_commit": "8c484e584d60a3bd2763d6948d0eb3f4afd67e0c",
              "runtime_fingerprint": runtime_fingerprint(),
              "runtime_identity": identity,
              "portable_profile": "steggate.portable-micronode.v1",
              "provider_credentials_transported": False,
              "public_steggate_ingress_required": False,
              "decision_authority_duplicated": False,
              "transport_identity_authoritative": False,
              "provider_callback_reachable_only_after_steggate_and_coherence_allow": True,
              "public_provider_execution_proven": False,
              "status": "PASS"
          }
          assert identity["contract_version"] == "stegverse.steggate.runtime-identity.v1"
          assert identity["runtime_identity"] == "stegverse:steggate:canonical:three-layer:v1"
          assert identity["canonical_owner"] == "StegVerse-Labs/StegCore"
          assert identity["canonical_admissibility_runtime"] == "stegcore.three_layer.evaluate_three_layer"
          assert identity["transport_identity_authoritative"] is False
          canonical = json.dumps(record, sort_keys=True, separators=(",", ":")).encode()
          record["receipt_hash"] = hashlib.sha256(canonical).hexdigest()
          Path("artifacts/steggate-portable-consumer-receipt.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: steggate-portable-consumer-evidence
          path: artifacts/steggate-portable-consumer-receipt.json
          if-no-files-found: error
          retention-days: 90
