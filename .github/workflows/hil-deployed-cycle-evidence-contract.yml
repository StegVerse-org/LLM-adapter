name: HIL Deployed Cycle Evidence Contract

on:
  push:
    paths:
      - "scripts/verify_hil_deployed_cycle_evidence.py"
      - ".github/workflows/hil-deployed-cycle-evidence-contract.yml"
  pull_request:
    paths:
      - "scripts/verify_hil_deployed_cycle_evidence.py"
      - ".github/workflows/hil-deployed-cycle-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build conforming deployed-cycle evidence
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          import hashlib, json
          evidence = {
            "schema_version": "HIL-DEPLOYED-CYCLE-EVIDENCE-v1",
            "observation_scope": "DEPLOYED_CONTROLLED_CYCLE",
            "storage_scope": "EXTERNAL_DURABLE_SERVICE",
            "receiver_origin": "https://receiver.example",
            "primary_version": "v1.1",
            "primary_sha256": "a7b1c62e336b4e244ecf7fdcd10af195401f6c44328de32615b073d2a5c3c462",
            "protocol_version": "HIL-PROTOCOL-v1.1",
            "prompt_version": "HIL-PROMPT-v1.1",
            "prompt_sha256": "cdff8d2266bb3eefbb6e5d28d9adc548e6c8dfc039debd72fe404f1d0249912c",
            "provenance_schema": "HIL-RESPONSE-PROVENANCE-v1.1",
            "receipt_schema": "HIL-RECEIVER-RECEIPT-v2",
            "submission_id": "submission-1",
            "response_id": "HIL-RESP-CONTROLLED-0001",
            "response_sha256": "1" * 64,
            "provenance_manifest_sha256": "2" * 64,
            "receiver_receipt_sha256": "3" * 64,
            "private_review_receipt_sha256": "4" * 64,
            "publication_record_sha256": "5" * 64,
            "readiness_probe_sha256": "6" * 64,
            "readiness_before_upload": "READY",
            "readiness_after_restart": "READY",
            "controlled_upload_completed": True,
            "exact_response_bytes_persisted": True,
            "provenance_manifest_persisted": True,
            "actual_service_restart_or_replacement": True,
            "private_review_decision": "ACCEPT_PRIVATE",
            "append_only_publication_state": "PUBLISHED_APPEND_ONLY",
            "stable_public_lookup_completed": True,
            "site_import_completed": False,
            "master_record_release_completed": False,
            "execution_authority": False,
            "publication_authority_granted_by_evidence": False,
            "master_record_append_authority_granted_by_evidence": False,
            "authority_effect": "NONE"
          }
          evidence["evidence_sha256"] = hashlib.sha256(json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          open("reports/hil-deployed-cycle-evidence.json", "w", encoding="utf-8").write(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY
      - name: Accept exact deployed-cycle evidence
        run: python scripts/verify_hil_deployed_cycle_evidence.py
      - name: Reject ephemeral storage masquerading as deployment
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = "reports/hil-deployed-cycle-evidence.json"
          evidence = json.load(open(path, encoding="utf-8"))
          evidence["storage_scope"] = "GITHUB_HOSTED_EPHEMERAL_FULL_CYCLE_PROOF"
          open(path, "w", encoding="utf-8").write(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY
          if python scripts/verify_hil_deployed_cycle_evidence.py; then
            echo "Verifier incorrectly accepted ephemeral evidence" >&2
            exit 1
          fi
