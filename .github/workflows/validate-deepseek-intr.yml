# Deterministic validation only. This workflow has no runtime, credential, route, or activation authority.
name: validate-deepseek-intr

on:
  push:
    paths:
      - 'llm_adapter/deepseek_intr_transport.py'
      - 'llm_adapter/deepseek_intr_executor.py'
      - 'llm_adapter/deepseek_tvc_broker.py'
      - 'llm_adapter/deepseek_tvc_runtime_executor.py'
      - 'config/deepseek-runtime-profile.json'
      - 'tests/test_deepseek_intr_transport.py'
      - 'tests/test_deepseek_intr_executor.py'
      - 'tests/test_deepseek_tvc_runtime.py'
      - 'schemas/deepseek-intr-transport-envelope.schema.json'
      - 'capability/stegverse-intr-deepseek-transport.capability.json'
      - 'docs/DEEPSEEK_INTR_*'
      - 'docs/DEEPSEEK_RUNTIME_PROFILE_*'
      - 'tasks/LLMA-DEEPSEEK-INTR-*'
      - 'tasks/LLMA-DEEPSEEK-RUNTIME-PROFILE-*'
      - 'README.md'
      - 'adapter.capabilities.json'
      - '.github/workflows/validate-deepseek-intr.yml'
  pull_request:
    paths:
      - 'llm_adapter/deepseek_intr_transport.py'
      - 'llm_adapter/deepseek_intr_executor.py'
      - 'llm_adapter/deepseek_tvc_broker.py'
      - 'llm_adapter/deepseek_tvc_runtime_executor.py'
      - 'config/deepseek-runtime-profile.json'
      - 'tests/test_deepseek_intr_transport.py'
      - 'tests/test_deepseek_intr_executor.py'
      - 'tests/test_deepseek_tvc_runtime.py'
      - 'schemas/deepseek-intr-transport-envelope.schema.json'
      - 'capability/stegverse-intr-deepseek-transport.capability.json'
      - 'docs/DEEPSEEK_INTR_*'
      - 'docs/DEEPSEEK_RUNTIME_PROFILE_*'
      - 'tasks/LLMA-DEEPSEEK-INTR-*'
      - 'tasks/LLMA-DEEPSEEK-RUNTIME-PROFILE-*'
      - 'README.md'
      - 'adapter.capabilities.json'
      - '.github/workflows/validate-deepseek-intr.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-deepseek-intr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-deepseek-intr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN DEEPSEEK_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:$key"
              exit 1
            fi
          done

      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve Python
        shell: bash
        run: |
          set -euo pipefail
          selected="$(command -v python3 || command -v python)"
          echo "PYTHON_BIN=$selected" >> "$GITHUB_ENV"
          "$selected" --version

      - name: Install validation dependencies
        run: "$PYTHON_BIN -m pip install -e '.[dev]'"

      - name: Test DeepSeek Interlock/InTr transport
        run: "$PYTHON_BIN -m pytest tests/test_deepseek_intr_transport.py -q"

      - name: Test governed DeepSeek executor and egress binding
        run: "$PYTHON_BIN -m pytest tests/test_deepseek_intr_executor.py -q"

      - name: Test DeepSeek runtime-profile TVC broker bridge
        run: "$PYTHON_BIN -m pytest tests/test_deepseek_tvc_runtime.py -q"

      - name: Validate capability declaration and envelope schema
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path

          capability = json.loads(Path('capability/stegverse-intr-deepseek-transport.capability.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/deepseek-intr-transport-envelope.schema.json').read_text(encoding='utf-8'))
          root = json.loads(Path('adapter.capabilities.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('config/deepseek-runtime-profile.json').read_text(encoding='utf-8'))

          assert capability['capability_id'] == 'stegverse.intr.deepseek.transport.v1'
          assert capability['provider'] == 'deepseek'
          assert capability['authority']['authority_effect'] == 'NONE'
          assert capability['authority']['synthesizes_allow'] is False
          assert capability['authority']['ingress_decision_point'] == 'external:StegVerse-Interlock/InTr'
          assert capability['authority']['egress_decision_point'] == 'external:StegVerse-Interlock/InTr'
          assert capability['credential']['credential_authority'] == 'TV/TVC'
          assert capability['credential']['credential_class'] == 'TV_TVC_PROVIDER_SECRET'
          assert capability['credential']['credential_material_present'] is False
          assert capability['credential']['persisted'] is False
          assert capability['independence']['canonical_sovereign_route_replaced'] is False
          assert capability['activation']['live'] is False
          assert capability['transport']['endpoint_profiles']['deepseek_openai_compatible'] == 'https://api.deepseek.com'
          assert capability['transport']['supported_models'] == ['deepseek-v4-flash', 'deepseek-v4-pro']
          assert schema['properties']['transport_id']['pattern'] == '^dsit-[0-9a-f]{64}$'
          assert schema['properties']['authority_effect']['const'] == 'NONE'
          assert schema['properties']['egress_intr_required']['const'] is True
          assert schema['properties']['credential_material_present']['const'] is False
          assert root['deepseek_intr_interoperability']['protocol'] == 'stegverse.intr.deepseek.transport.v1'
          assert root['deepseek_intr_interoperability']['canonical_sovereign_route_replaced'] is False
          assert runtime['profile_id'] == 'stegverse:runtime-profile:llm-adapter-deepseek:v1'
          assert runtime['base_profile'] == 'stegverse:runtime-profile:hb-intr-resident:v1'
          assert runtime['provider_execution']['credential_authority'] == 'TV/TVC'
          assert runtime['provider_execution']['credential_material_in_llm_adapter'] is False
          assert runtime['provider_execution']['direct_credential_resolver_production_allowed'] is False
          assert runtime['physical_runtime']['another_physical_machine_required'] is False
          assert runtime['physical_runtime']['linux_specific_runtime_required'] is False
          print('DEEPSEEK_INTR_CAPABILITY_DECLARATION=VALID')
          print('DEEPSEEK_RUNTIME_PROFILE_BINDING=VALID')
          print('DEEPSEEK_INTR_ACTIVATION_LIVE=false')
          PY

      - name: Confirm validation-only authority boundary
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-deepseek-intr.yml').read_text(encoding='utf-8')
          assert 'permissions: {}' in workflow
          assert 'DEEPSEEK_API_KEY' in workflow
          assert 'STEGVERSE_MASTER_RECORDS_TOKEN' in workflow
          assert 'tests/test_deepseek_intr_transport.py' in workflow
          assert 'tests/test_deepseek_intr_executor.py' in workflow
          assert 'tests/test_deepseek_tvc_runtime.py' in workflow
          forbidden = [
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'git ' + 'push',
              'schedule' + ':',
          ]
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('DEEPSEEK_INTR_VALIDATION_AUTHORITY=NONE')
          print('DEEPSEEK_INTR_CREDENTIAL_AUTHORITY=TV_TVC')
          print('DEEPSEEK_INTR_RUNTIME_EFFECT=NONE')
          PY
