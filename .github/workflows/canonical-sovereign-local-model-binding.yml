name: Canonical Sovereign Local Model Binding

on:
  push:
    branches: [main]
    paths:
      - 'llm_adapter/http_provider_clients.py'
      - 'llm_adapter/provider_request.py'
      - 'tests/test_canonical_sovereign_local_model_binding.py'
      - 'tasks/LLMA-CANONICAL-LOCAL-MODEL-BINDING-018.json'
      - '.github/workflows/canonical-sovereign-local-model-binding.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-sovereign-local-model-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bind-canonical-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          path: adapter
      - name: Checkout canonical micro-node model owner
        uses: actions/checkout@v4
        with:
          repository: StegVerse-002/micro-node-runtime
          ref: 395d4013d1354c07bc3cf66c44f4f26f856c75fc
          path: micro-node-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install adapter runtime dependency
        run: python -m pip install requests
      - name: Execute real canonical local model through adapter sovereign client
        working-directory: adapter
        env:
          PYTHONPATH: .
          MICRO_NODE_RUNTIME_DIR: ../micro-node-runtime
        run: python tests/test_canonical_sovereign_local_model_binding.py | tee /tmp/binding.json
      - name: Persist hash-bound integration receipt
        working-directory: adapter
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          observed=json.loads(Path('/tmp/binding.json').read_text().strip().splitlines()[-1])
          receipt={
            'schema_version':'stegverse.canonical-sovereign-local-model-binding.v1',
            'state':'COMPLETE',
            'canonical_model_owner':'StegVerse-002/micro-node-runtime#22',
            'canonical_model_commit':'395d4013d1354c07bc3cf66c44f4f26f856c75fc',
            'transport_owner':'StegVerse-org/LLM-adapter#18',
            'provider_client':'StegVerseLocalHTTPProviderClient',
            'private_loopback_endpoint':True,
            'real_model_process_observed':True,
            'real_inference_response_observed':True,
            'measured_usage_source':'canonical model runtime response',
            'third_party_execution_platform_required':False,
            'provider_credential_required':False,
            'sovereign_node_activation_proven':False,
            'observation_scope':'github_hosted_cross_repository_integration_validation',
            'observed':observed,
            'authority_effect':'NONE',
            'next_owner':'StegVerse-Labs/.github#60 + StegVerse-002/micro-node-runtime#16 + StegVerse-org/LLM-adapter#18',
            'next_executable_action':'execute the same canonical binding on a declared StegVerse-owned/federated carrier, then retain measured usage and same-execution Master Records reconstruction evidence'
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['receipt_hash']=hashlib.sha256(raw).hexdigest()
          out=Path('receipts/canonical-sovereign-local-model-binding.latest.json'); out.parent.mkdir(exist_ok=True); out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'state':receipt['state'],'receipt_hash':receipt['receipt_hash'],'model':observed['model']}))
          PY
      - name: Persist receipt
        working-directory: adapter
        run: |
          git config user.name 'canonical-local-model-binding[bot]'
          git config user.email 'canonical-local-model-binding[bot]@users.noreply.github.com'
          git add receipts/canonical-sovereign-local-model-binding.latest.json
          if git diff --cached --quiet; then echo 'receipt unchanged'; else git commit -m 'receipt: persist canonical local model binding [skip ci]'; git pull --rebase; git push; fi
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-sovereign-local-model-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: adapter/receipts/canonical-sovereign-local-model-binding.latest.json
          if-no-files-found: error
          retention-days: 90
