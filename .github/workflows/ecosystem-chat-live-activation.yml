name: Ecosystem Chat Live Activation

on:
  workflow_run:
    workflows:
      - validate
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecosystem-chat-live-activation
  cancel-in-progress: false

jobs:
  verify-live-activation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out adapter
        uses: actions/checkout@v4

      - name: Preserve first verified activation receipt
        id: preserved
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("receipts/ecosystem-chat-live-activation.verified.json")
          verified = False
          if path.exists():
              try:
                  verified = json.loads(path.read_text()).get("state") == "VERIFIED"
              except Exception:
                  verified = False
          print(f"verified={'true' if verified else 'false'}")
          PY

      - name: Verify deployed request, provider, custody, and reconstruction path
        if: steps.preserved.outputs.verified != 'true'
        id: verify
        continue-on-error: true
        env:
          STEGVERSE_GATEWAY_BASE_URL: ${{ vars.STEGVERSE_GATEWAY_BASE_URL || 'https://stegverse-ecosystem-chat-gateway.onrender.com' }}
        run: python scripts/verify_live_ecosystem_chat_activation.py

      - name: Upload current activation observation
        if: steps.preserved.outputs.verified != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-chat-live-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/ecosystem-chat-live-activation.latest.json
          if-no-files-found: error

      - name: Retain first verified activation receipt
        if: steps.preserved.outputs.verified != 'true'
        run: |
          state="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('receipts/ecosystem-chat-live-activation.latest.json').read_text()).get('state', 'PENDING'))
          PY
          )"
          if [ "$state" != "VERIFIED" ]; then
            echo "Activation remains pending; observation retained as a workflow artifact."
            exit 0
          fi
          cp receipts/ecosystem-chat-live-activation.latest.json receipts/ecosystem-chat-live-activation.verified.json
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('receipts/ecosystem-chat-live-activation.latest.json').read_text())
          verified = json.loads(Path('receipts/ecosystem-chat-live-activation.verified.json').read_text())
          if latest != verified or verified.get('state') != 'VERIFIED' or verified.get('blockers') != []:
              raise SystemExit('immutable verified receipt copy failed validation')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/ecosystem-chat-live-activation.verified.json
          git commit -m "chore: retain verified Ecosystem Chat live activation receipt [skip ci]"
          git pull --rebase
          git push

      - name: Summarize activation posture
        if: always()
        run: |
          echo "## Ecosystem Chat Live Activation" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.preserved.outputs.verified }}" = "true" ]; then
            echo "A verified activation receipt is already retained. No additional live mutation was attempted." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f receipts/ecosystem-chat-live-activation.latest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path('receipts/ecosystem-chat-live-activation.latest.json').read_text())
          print(f"State: {result.get('state')}")
          print(f"Blockers: {', '.join(result.get('blockers', [])) or 'none'}")
          print(f"Result SHA-256: {result.get('result_sha256')}")
          print("Authority granted: false")
          PY
          fi
