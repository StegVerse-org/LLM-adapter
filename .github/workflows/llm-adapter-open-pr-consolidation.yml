name: LLM Adapter Open PR Consolidation

on:
  pull_request:
    paths:
      - "data/llm-adapter-open-pr-consolidation.json"
      - "scripts/check_llm_adapter_open_pr_consolidation.py"
      - ".github/workflows/llm-adapter-open-pr-consolidation.yml"
      - "tasks/LLMA-STALE-ACTIVATION-PR-RECONCILIATION-016.json"
      - "docs/LLM_ADAPTER_MIRROR_HANDOFF.md"
      - "data/llm-adapter-orchestration-state.json"
  push:
    branches: [main]
    paths:
      - "data/llm-adapter-open-pr-consolidation.json"
      - "scripts/check_llm_adapter_open_pr_consolidation.py"
      - ".github/workflows/llm-adapter-open-pr-consolidation.yml"
      - "tasks/LLMA-STALE-ACTIVATION-PR-RECONCILIATION-016.json"
      - "docs/LLM_ADAPTER_MIRROR_HANDOFF.md"
      - "data/llm-adapter-orchestration-state.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: llm-adapter-open-pr-consolidation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed inventory
        run: python scripts/check_llm_adapter_open_pr_consolidation.py
      - name: Fetch authoritative pull-request snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/open-pr-snapshots
          for number in 10 13 23 27 36 58 60 63 85; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > "evidence/open-pr-snapshots/${number}.json"
          done
      - name: Validate live pull-request state and write receipt
        run: |
          python scripts/check_llm_adapter_open_pr_consolidation.py \
            --snapshots evidence/open-pr-snapshots \
            --receipt evidence/llm-adapter-open-pr-consolidation-receipt.json
      - name: Upload consolidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-adapter-open-pr-consolidation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
