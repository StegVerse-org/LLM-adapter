name: Local Runtime Model Proof

on:
  push:
    branches: [main]
    paths:
      - 'llm_adapter/local_model_runtime.py'
      - 'models/stegverse-local-reference-v1/**'
      - 'scripts/build_local_reference_model.py'
      - 'scripts/prove_local_runtime_model.py'
      - 'tests/test_local_runtime_model.py'
      - 'tasks/LLMA-LOCAL-RUNTIME-MODEL-017.json'
      - 'docs/LOCAL_RUNTIME_MODEL_MIRROR_HANDOFF.md'
      - '.github/workflows/local-runtime-model-proof.yml'
  pull_request:
    paths:
      - 'llm_adapter/local_model_runtime.py'
      - 'models/stegverse-local-reference-v1/**'
      - 'scripts/build_local_reference_model.py'
      - 'scripts/prove_local_runtime_model.py'
      - 'tests/test_local_runtime_model.py'
      - '.github/workflows/local-runtime-model-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-runtime-model-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild model locally and prove committed reproducibility
        run: |
          cp models/stegverse-local-reference-v1/weights.json /tmp/weights.before
          cp models/stegverse-local-reference-v1/manifest.json /tmp/manifest.before
          python scripts/build_local_reference_model.py
          diff -u /tmp/weights.before models/stegverse-local-reference-v1/weights.json
          diff -u /tmp/manifest.before models/stegverse-local-reference-v1/manifest.json
      - name: Validate model runtime and automatic discovery launch
        env:
          PYTHONPATH: .
        run: python tests/test_local_runtime_model.py
      - name: Produce real loopback inference proof
        env:
          PYTHONPATH: .
        run: python scripts/prove_local_runtime_model.py
      - name: Validate proof receipt
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('receipts/local-runtime-model-proof.latest.json')
          v=json.loads(p.read_text())
          expected=v.pop('receipt_hash')
          actual=hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert expected==actual
          assert v['state']=='COMPLETE'
          assert v['real_local_inference_observed'] is True
          assert v['external_provider_used'] is False
          assert v['runtime_identity']['protocol']=='stegverse.local-runtime.v1'
          assert v['inference']['model_id']=='stegverse-local-reference-v1'
          assert v['authority_attached'] is False
          print('local runtime model proof: PASS')
          PY
      - name: Persist proof receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'local-runtime-model[bot]'
          git config user.email 'local-runtime-model[bot]@users.noreply.github.com'
          git add receipts/local-runtime-model-proof.latest.json
          if git diff --cached --quiet; then
            echo 'Proof receipt unchanged.'
          else
            git commit -m 'receipt: persist local runtime model proof [skip ci]'
            git pull --rebase
            git push
          fi
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-model-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            models/stegverse-local-reference-v1/manifest.json
            models/stegverse-local-reference-v1/weights.json
            receipts/local-runtime-model-proof.latest.json
          if-no-files-found: error
          retention-days: 90
