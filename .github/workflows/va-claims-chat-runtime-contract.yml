name: VA Claims Chat runtime contract

on:
  push:
    branches: [main]
    paths:
      - contracts/va-claims-chat-runtime.json
      - scripts/validate_va_claims_chat_runtime_contract.py
      - receipts/va-claims-chat-runtime-contract-validation.json
      - docs/VA_CLAIMS_CHAT_RUNTIME_MIRROR_HANDOFF.md
      - .github/workflows/va-claims-chat-runtime-contract.yml
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claims-chat-runtime-contract
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate governed runtime contract
        run: python scripts/validate_va_claims_chat_runtime_contract.py

      - name: Retain validation receipt
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/va-claims-chat-runtime-contract-validation.json
          if git diff --cached --quiet; then
            echo "Runtime contract validation receipt unchanged."
          else
            git commit -m "chore: retain VA claims chat runtime contract receipt [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-claims-chat-runtime-contract-${{ github.run_id }}
          path: |
            contracts/va-claims-chat-runtime.json
            receipts/va-claims-chat-runtime-contract-validation.json
          if-no-files-found: error
          retention-days: 30
