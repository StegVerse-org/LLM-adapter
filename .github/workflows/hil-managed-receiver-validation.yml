name: HIL managed receiver validation

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "scripts/container-entrypoint.sh"
      - "render.yaml"
      - "llm_adapter/**"
      - ".github/workflows/hil-managed-receiver-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-managed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate provider-neutral managed-host contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path('render.yaml').read_text())
          services = manifest.get('services') or []
          assert len(services) == 1, 'expected exactly one managed receiver service'
          service = services[0]
          assert service.get('runtime') == 'docker'
          assert service.get('healthCheckPath') == '/api/hil/readiness'
          assert service.get('autoDeployTrigger') in ('off', None)
          disks = service.get('disk') or service.get('disks')
          assert disks, 'durable disk declaration missing'
          disk = disks[0] if isinstance(disks, list) else disks
          assert disk.get('mountPath') == '/var/lib/stegverse'
          env = {item['key']: item for item in service.get('envVars', [])}
          assert env.get('STEGVERSE_HIL_INTAKE_ENABLED', {}).get('value') == 'true'
          assert env.get('STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS', {}).get('value') == 'true'
          for key in ('STEGVERSE_HIL_REVIEW_TOKEN','STEGVERSE_HIL_PUBLICATION_TOKEN'):
              assert key in env and env[key].get('generateValue') is True, f'{key} must be host generated'
          print('managed-host-contract: PASS')
          PY

      - name: Build receiver image
        run: docker build -t stegverse-hil-managed:${{ github.sha }} .

      - name: Start receiver with ephemeral CI volume
        run: |
          docker volume create stegverse-hil-ci
          docker run -d --name stegverse-hil-ci \
            -p 18080:8000 \
            -v stegverse-hil-ci:/var/lib/stegverse \
            -e STEGVERSE_HIL_INTAKE_ENABLED=true \
            -e STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS=true \
            -e STEGVERSE_HIL_REVIEW_TOKEN=ci-review-token-not-production-000000000000 \
            -e STEGVERSE_HIL_PUBLICATION_TOKEN=ci-publication-token-not-production-000000 \
            -e STEGVERSE_ALLOWED_ORIGINS=https://stegverse.org,https://www.stegverse.org,https://stegverse-labs.github.io \
            stegverse-hil-managed:${{ github.sha }}

      - name: Verify readiness
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          url='http://127.0.0.1:18080/api/hil/readiness'
          last=None
          latest=None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=3) as r:
                      latest=json.load(r)
                  Path('artifacts/hil-readiness.json').write_text(json.dumps(latest, indent=2, sort_keys=True)+'\n')
                  assert latest['state']=='READY', json.dumps(latest, sort_keys=True)
                  assert latest['blockers']==[], json.dumps(latest, sort_keys=True)
                  assert latest['primary_sha256']=='a7b1c62e336b4e244ecf7fdcd10af195401f6c44328de32615b073d2a5c3c462'
                  assert latest['prompt_sha256']=='cdff8d2266bb3eefbb6e5d28d9adc548e6c8dfc039debd72fe404f1d0249912c'
                  print(json.dumps(latest, indent=2, sort_keys=True))
                  break
              except Exception as exc:
                  last=exc
                  time.sleep(2)
          else:
              raise SystemExit(f'readiness failed: {last}; latest={json.dumps(latest, sort_keys=True) if latest else None}')
          PY

      - name: Preserve validation evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker logs stegverse-hil-ci > artifacts/hil-managed-receiver.log 2>&1 || true
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          readiness_path=Path('artifacts/hil-readiness.json')
          readiness=json.loads(readiness_path.read_text()) if readiness_path.exists() else None
          passed=bool(readiness and readiness.get('state')=='READY' and readiness.get('blockers')==[])
          receipt={
            'schema':'HIL-MANAGED-RUNTIME-VALIDATION-v2',
            'captured_at':datetime.now(timezone.utc).isoformat(),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'commit_sha':os.environ.get('GITHUB_SHA'),
            'execution_venue':'repository-owned-github-actions',
            'validation_state':'PASS' if passed else 'FAIL',
            'readiness':readiness,
            'participant_hardware_required':False,
            'public_https_deployment_verified':False,
            'hosted_persistence_verified':False,
            'site_activation_authorized':False
          }
          Path('artifacts/hil-managed-runtime-validation.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-managed-runtime-validation
          path: artifacts/
