name: VA Claim Assistant Provider Preflight

on:
  push:
    branches: [main]
    paths:
      - 'requests/va-claim-assistant-provider-execution-authority-request.github-models.v1.json'
      - 'receipts/va-claim-assistant-provider-execution-authority.github-models.v1.json'
      - 'scripts/validate_va_provider_execution_authority.py'
      - 'scripts/observe_va_provider_execution_preflight.py'
      - 'scripts/check_va_provider_preflight_hosted_path.py'
      - 'vendor/tvc/e3865e79662529e07d27199235431056d127ea63/issue_va_ephemeral_route_admission.py'
      - '.github/workflows/va-claim-assistant-provider-preflight.yml'
      - 'tasks/VACP-ADAPTER-EXECUTION-PREFLIGHT-004.json'
      - 'tasks/VACP-PREFLIGHT-HOSTED-EXECUTION-008.json'
      - 'docs/VA_CLAIM_ASSISTANT_PROVIDER_PREFLIGHT_MIRROR_HANDOFF.md'
  pull_request:
    paths:
      - 'requests/va-claim-assistant-provider-execution-authority-request.github-models.v1.json'
      - 'receipts/va-claim-assistant-provider-execution-authority.github-models.v1.json'
      - 'scripts/validate_va_provider_execution_authority.py'
      - 'scripts/observe_va_provider_execution_preflight.py'
      - 'scripts/check_va_provider_preflight_hosted_path.py'
      - 'vendor/tvc/e3865e79662529e07d27199235431056d127ea63/issue_va_ephemeral_route_admission.py'
      - '.github/workflows/va-claim-assistant-provider-preflight.yml'
      - 'tasks/VACP-ADAPTER-EXECUTION-PREFLIGHT-004.json'
      - 'tasks/VACP-PREFLIGHT-HOSTED-EXECUTION-008.json'
      - 'docs/VA_CLAIM_ASSISTANT_PROVIDER_PREFLIGHT_MIRROR_HANDOFF.md'
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-claim-assistant-provider-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  TVC_ADMISSION_SOURCE_COMMIT: e3865e79662529e07d27199235431056d127ea63
  TVC_ADMISSION_SOURCE_BLOB_SHA: e9bb981fbd4afea934c8b800a0f70f6b6ddaf61c
  TVC_ADMISSION_SOURCE_PATH: vendor/tvc/e3865e79662529e07d27199235431056d127ea63/issue_va_ephemeral_route_admission.py

jobs:
  issue-tvc-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt_hash: ${{ steps.issue.outputs.receipt_hash }}
      receipt_id: ${{ steps.issue.outputs.receipt_id }}
      issued_at: ${{ steps.issue.outputs.issued_at }}
      expires_at: ${{ steps.issue.outputs.expires_at }}
      state: ${{ steps.issue.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned public-safe TVC issuer mirror
        run: |
          test -f "$TVC_ADMISSION_SOURCE_PATH"
          test "$(git hash-object "$TVC_ADMISSION_SOURCE_PATH")" = "$TVC_ADMISSION_SOURCE_BLOB_SHA"
          python -m py_compile "$TVC_ADMISSION_SOURCE_PATH"

      - name: Issue fresh single-use TVC admission
        id: issue
        run: |
          mkdir -p .tvc-admission
          python "$TVC_ADMISSION_SOURCE_PATH" \
            --route service_connection \
            --caller-repository StegVerse-org/LLM-adapter \
            --caller-commit "${GITHUB_SHA}" \
            --source-registry-commit e69e8421084b1343a9dc809fdb2a579089d37813 \
            --source-registry-blob-sha a83ff2dd8343f947265981609b154693cc5deecc \
            --answer-schema-commit ae64a81df7ac91a9b2df00e9b8ff1a8358fcb9ab \
            --answer-receipt-hash bd1f6c3e751b1adf2345383f724f133c321e0e42096b4556f682837caf73ee29 \
            --dispatch-receipt-hash 55419dc015db717f10914c86286b3222493753545f03fb4bd675a7dd2db4bd4e \
            --purpose SOURCE_GROUNDED_VA_CLAIM_GUIDANCE \
            --scope PUBLIC_SOURCE_SERVICE_CONNECTION_PROCEDURAL_GUIDANCE \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output .tvc-admission/va-route-ephemeral-admission.json

      - name: Write actual execution provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          admission = json.loads(Path('.tvc-admission/va-route-ephemeral-admission.json').read_text())
          value = {
              'schema': 'stegverse.tvc.vendored_admission_execution_provenance.v1',
              'canonical_source_repository': 'StegVerse-Labs/TVC',
              'canonical_source_workflow': '.github/workflows/va-route-ephemeral-admission.yml',
              'canonical_source_commit': os.environ['TVC_ADMISSION_SOURCE_COMMIT'],
              'canonical_source_blob_sha': os.environ['TVC_ADMISSION_SOURCE_BLOB_SHA'],
              'execution_repository': os.environ['GITHUB_REPOSITORY'],
              'execution_workflow': '.github/workflows/va-claim-assistant-provider-preflight.yml',
              'execution_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'admission_receipt_id': admission['receipt_id'],
              'admission_receipt_hash': admission['receipt_hash'],
              'private_cross_organization_reusable_workflow_called': False,
              'provider_permission_requested': False,
              'provider_execution_observed': False,
              'authority_effect': False,
              'activation_effect': False,
          }
          material = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          value['provenance_sha256'] = hashlib.sha256(material).hexdigest()
          Path('.tvc-admission/va-route-ephemeral-admission-provenance.json').write_text(
              json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Verify admission and execution boundaries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          admission = json.loads(Path('.tvc-admission/va-route-ephemeral-admission.json').read_text())
          material = dict(admission)
          expected = material.pop('receipt_hash')
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          ).hexdigest()
          assert expected == actual
          assert admission['state'] == 'ADMITTED_PENDING_PROVIDER_EXECUTION'
          assert admission['issuer']['repository'] == 'StegVerse-Labs/TVC'
          assert admission['issuer']['workflow'] == '.github/workflows/va-route-ephemeral-admission.yml'
          issued = datetime.fromisoformat(admission['validity']['issued_at'].replace('Z', '+00:00'))
          expires = datetime.fromisoformat(admission['validity']['expires_at'].replace('Z', '+00:00'))
          assert int((expires - issued).total_seconds()) == 900
          assert admission['validity']['single_use'] is True
          assert admission['provider_execution_requested'] is False
          assert admission['provider_execution_observed'] is False
          assert not any(admission['authority_flags'].values())
          assert admission['activation_effect'] is False

          provenance = json.loads(Path('.tvc-admission/va-route-ephemeral-admission-provenance.json').read_text())
          provenance_material = dict(provenance)
          provenance_expected = provenance_material.pop('provenance_sha256')
          provenance_actual = hashlib.sha256(
              json.dumps(provenance_material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          ).hexdigest()
          assert provenance_expected == provenance_actual
          assert provenance['execution_repository'] == 'StegVerse-org/LLM-adapter'
          assert provenance['execution_workflow'] == '.github/workflows/va-claim-assistant-provider-preflight.yml'
          assert provenance['canonical_source_blob_sha'] == 'e9bb981fbd4afea934c8b800a0f70f6b6ddaf61c'
          assert provenance['admission_receipt_hash'] == admission['receipt_hash']
          assert provenance['private_cross_organization_reusable_workflow_called'] is False
          assert provenance['provider_permission_requested'] is False
          assert provenance['provider_execution_observed'] is False
          assert provenance['authority_effect'] is False
          assert provenance['activation_effect'] is False
          print('VA_TVC_VENDORED_ADMISSION_BOUNDARY_PASS')
          PY

      - name: Upload fresh admission for same-run consumption
        uses: actions/upload-artifact@v4
        with:
          name: va-route-ephemeral-admission
          path: .tvc-admission/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  derive-preflight:
    needs: issue-tvc-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download same-run TVC admission artifact
        uses: actions/download-artifact@v4
        with:
          name: va-route-ephemeral-admission
          path: .tvc-admission

      - name: Verify admission execution provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          admission = json.loads(Path('.tvc-admission/va-route-ephemeral-admission.json').read_text())
          provenance = json.loads(Path('.tvc-admission/va-route-ephemeral-admission-provenance.json').read_text())
          material = dict(provenance)
          expected = material.pop('provenance_sha256')
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          ).hexdigest()
          assert expected == actual
          assert provenance['canonical_source_commit'] == os.environ['TVC_ADMISSION_SOURCE_COMMIT']
          assert provenance['canonical_source_blob_sha'] == os.environ['TVC_ADMISSION_SOURCE_BLOB_SHA']
          assert provenance['execution_repository'] == os.environ['GITHUB_REPOSITORY']
          assert provenance['execution_commit'] == os.environ['GITHUB_SHA']
          assert provenance['workflow_run_id'] == os.environ['GITHUB_RUN_ID']
          assert provenance['workflow_run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert provenance['admission_receipt_hash'] == admission['receipt_hash']
          assert provenance['authority_effect'] is False
          assert provenance['activation_effect'] is False
          print('VA_TVC_ADMISSION_PROVENANCE_PASS')
          PY

      - name: Verify non-authorizing request contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('requests/va-claim-assistant-provider-execution-authority-request.github-models.v1.json').read_text())
          assert value['state'] == 'REQUESTED_NOT_APPROVED'
          assert value['request_is_execution_authority'] is False
          assert value['credential_presence_is_execution_authority'] is False
          assert value['single_execution'] is True
          assert value['maximum_provider_requests'] == 1
          assert float(value['maximum_request_cost_usd_ceiling']) <= 0.10
          for field in (
              'provider_output_is_authority',
              'external_mutation_authorized',
              'publication_authorized',
              'deployment_authorized',
              'release_authorized',
              'filing_authorized',
              'submission_authorized',
              'representation_authorized',
              'adjudication_authorized',
              'rating_authorized',
              'medical_opinion_authorized',
              'site_activation_authorized',
          ):
              assert value[field] is False, field
          print('VA_PROVIDER_AUTHORITY_REQUEST_CONTRACT_PASS')
          PY

      - name: Validate optional explicit provider authority
        id: authority
        run: |
          rm -f .va-authority-validation.json
          authority='receipts/va-claim-assistant-provider-execution-authority.github-models.v1.json'
          if [ ! -f "$authority" ]; then
            echo 'authority_state=MISSING' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/validate_va_provider_execution_authority.py \
              --receipt "$authority" \
              --output .va-authority-validation.json; then
            echo 'authority_state=VALID' >> "$GITHUB_OUTPUT"
          else
            rm -f .va-authority-validation.json
            echo 'authority_state=INVALID' >> "$GITHUB_OUTPUT"
          fi

      - name: Derive fail-closed provider execution preflight
        env:
          STEGVERSE_MASTER_RECORDS_ENDPOINT: ${{ vars.STEGVERSE_MASTER_RECORDS_ENDPOINT }}
          STEGVERSE_MASTER_RECORDS_ALLOWED_HOSTS: ${{ vars.STEGVERSE_MASTER_RECORDS_ALLOWED_HOSTS }}
          STEGVERSE_MASTER_RECORDS_TOKEN: ${{ secrets.STEGVERSE_MASTER_RECORDS_TOKEN }}
        run: |
          python scripts/observe_va_provider_execution_preflight.py \
            --admission .tvc-admission/va-route-ephemeral-admission.json \
            --authority-validation .va-authority-validation.json \
            --expected-caller-commit "${GITHUB_SHA}" \
            --output receipts/va-claim-assistant-provider-execution-preflight.json

      - name: Verify preflight cannot execute or grant authority
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          value = json.loads(Path('receipts/va-claim-assistant-provider-execution-preflight.json').read_text())
          material = dict(value)
          expected = material.pop('result_sha256')
          actual = hashlib.sha256(
              json.dumps(material, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          assert expected == actual
          assert value['state'] in {
              'CONFIGURATION_REQUIRED',
              'AUTHORITY_REQUIRED',
              'READY_FOR_EXPLICIT_AUTHORIZED_EXECUTION',
              'REVIEW_REQUIRED',
          }
          assert value['provider']['permission_requested_by_preflight'] is False
          assert value['provider']['provider_execution_observed'] is False
          assert value['secret_values_present'] is False
          assert value['authority_effect'] is False
          assert value['activation_effect'] is False
          assert value['custody_state'] == 'NOT_SUBMITTED'
          assert value['reconstruction_state'] == 'NOT_SUBMITTED'
          print('VA_PROVIDER_PREFLIGHT_FAIL_CLOSED_PASS:' + value['state'])
          PY

      - name: Persist preflight receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'va-claim-assistant[bot]'
          git config user.email 'va-claim-assistant[bot]@users.noreply.github.com'
          git add receipts/va-claim-assistant-provider-execution-preflight.json
          if git diff --cached --quiet; then
            echo 'Preflight receipt unchanged.'
          else
            git commit -m 'receipt: retain VA provider execution preflight [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              echo "retrying preflight receipt push: $attempt"
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: va-claim-assistant-provider-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tvc-admission/va-route-ephemeral-admission.json
            .tvc-admission/va-route-ephemeral-admission-provenance.json
            requests/va-claim-assistant-provider-execution-authority-request.github-models.v1.json
            receipts/va-claim-assistant-provider-execution-preflight.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
