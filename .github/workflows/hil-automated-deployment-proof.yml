name: HIL Automated Deployment Proof

on:
  pull_request:
    paths:
      - "llm_adapter/hil_*.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - ".github/workflows/hil-automated-deployment-proof.yml"
  push:
    branches: [main]
    paths:
      - "llm_adapter/hil_*.py"
      - "llm_adapter/combined_gateway.py"
      - "tests/test_hil_*.py"
      - ".github/workflows/hil-automated-deployment-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEGVERSE_HIL_INTAKE_ENABLED: "true"
      STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS: "true"
      STEGVERSE_HIL_DATA_DIR: ${{ github.workspace }}/.hil-durable
      STEGVERSE_ALLOWED_ORIGINS: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gateway and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,service]"
      - name: Generate separated runtime credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          values = {
              "STEGVERSE_HIL_REVIEW_TOKEN": secrets.token_urlsafe(48),
              "STEGVERSE_HIL_PUBLICATION_TOKEN": secrets.token_urlsafe(48),
          }
          assert len(set(values.values())) == len(values)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print(f"::add-mask::{value}")
                  env_file.write(f"{key}={value}\n")
              env_file.write("STEGVERSE_HIL_CREDENTIAL_SEPARATION_VERIFIED=true\n")
          PY
      - name: Run complete governed-cycle tests
        run: |
          python -m pytest -q \
            tests/test_hil_intake_api.py \
            tests/test_hil_provenance_chain.py \
            tests/test_hil_publication_api.py \
            tests/test_hil_controlled_cycle.py
      - name: Start gateway and verify readiness
        shell: bash
        run: |
          mkdir -p "$STEGVERSE_HIL_DATA_DIR" reports
          python -m uvicorn llm_adapter.combined_gateway:app --host 127.0.0.1 --port 8000 > reports/gateway-first.log 2>&1 &
          echo $! > reports/gateway.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/hil/readiness > reports/intake-readiness-before.json && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/hil/publication-readiness > reports/publication-readiness-before.json
          kill "$(cat reports/gateway.pid)"
          wait "$(cat reports/gateway.pid)" || true
      - name: Restart gateway against the same durable path
        shell: bash
        run: |
          python -m uvicorn llm_adapter.combined_gateway:app --host 127.0.0.1 --port 8000 > reports/gateway-restart.log 2>&1 &
          echo $! > reports/gateway-restart.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/hil/readiness > reports/intake-readiness-after.json && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/hil/publication-readiness > reports/publication-readiness-after.json
      - name: Emit governed readiness observation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["STEGVERSE_HIL_DATA_DIR"])
          before = json.loads(Path("reports/intake-readiness-before.json").read_text())
          after = json.loads(Path("reports/intake-readiness-after.json").read_text())
          publication = json.loads(Path("reports/publication-readiness-after.json").read_text())
          credential_separation = os.environ.get("STEGVERSE_HIL_CREDENTIAL_SEPARATION_VERIFIED") == "true"
          persistent_files = sorted(
              str(path.relative_to(root)) for path in root.rglob("*") if path.is_file()
          )
          state = "CONTROLLED_CYCLE_READY" if (
              before.get("state") == "READY"
              and after.get("state") == "READY"
              and publication.get("state") == "READY"
              and credential_separation
          ) else "CONFIGURATION_REQUIRED"
          receipt = {
              "schema_version": "HIL-LIVE-READINESS-OBSERVATION-v2",
              "observation_scope": "GITHUB_HOSTED_EPHEMERAL_DEPLOYMENT_PROOF",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "observed_state": state,
              "intake_before_restart": before,
              "intake_after_restart": after,
              "publication_after_restart": publication,
              "credential_separation_verified": credential_separation,
              "durable_path_reused_across_process_restart": True,
              "persistent_files": persistent_files,
              "external_production_deployment_claimed": False,
              "authority_granted": False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["observation_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("reports/hil-live-readiness-observation-v2.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          if state != "CONTROLLED_CYCLE_READY":
              raise SystemExit("automated deployment proof did not reach CONTROLLED_CYCLE_READY")
          PY
      - name: Stop restarted gateway
        if: always()
        run: |
          test ! -f reports/gateway-restart.pid || kill "$(cat reports/gateway-restart.pid)" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-automated-deployment-proof
          path: reports/
          if-no-files-found: error
