name: Coinbase SKAP Service Gateway Validation

on:
  push:
    paths:
      - 'llm_adapter/service_gateway_coinbase_skap.py'
      - 'llm_adapter/service_gateway_composed.py'
      - 'llm_adapter/runtime_gateway.py'
      - 'llm_adapter/deployed_gateway.py'
      - 'llm_adapter/service_gateway_http01.py'
      - 'tests/test_service_gateway_http01.py'
      - 'docs/SERVICE_GATEWAY_HTTP01_CHALLENGE_PROJECTION_MIRROR_HANDOFF.md'
      - 'compose.stegdeploy.tls.yaml'
      - 'scripts/stegdeploy_bootstrap.py'
      - 'tests/test_stegdeploy_native_tls.py'
      - 'docs/STEGDEPLOY_NATIVE_TLS_INGRESS_MIRROR_HANDOFF.md'
      - 'llm_adapter/combined_gateway.py'
      - 'tests/test_node_advertisement.py'
      - 'tests/test_service_gateway_coinbase_skap.py'
      - 'tests/test_service_gateway_coinbase_skap_api.py'
      - 'tests/test_deployed_gateway_coinbase_skap.py'
      - 'docs/COINBASE_SKAP_SERVICE_GATEWAY_MIRROR_HANDOFF.md'
      - '.github/workflows/coinbase-skap-service-gateway.yml'
  pull_request:
    paths:
      - 'llm_adapter/service_gateway_coinbase_skap.py'
      - 'llm_adapter/service_gateway_composed.py'
      - 'llm_adapter/runtime_gateway.py'
      - 'llm_adapter/deployed_gateway.py'
      - 'llm_adapter/service_gateway_http01.py'
      - 'tests/test_service_gateway_http01.py'
      - 'docs/SERVICE_GATEWAY_HTTP01_CHALLENGE_PROJECTION_MIRROR_HANDOFF.md'
      - 'compose.stegdeploy.tls.yaml'
      - 'scripts/stegdeploy_bootstrap.py'
      - 'tests/test_stegdeploy_native_tls.py'
      - 'docs/STEGDEPLOY_NATIVE_TLS_INGRESS_MIRROR_HANDOFF.md'
      - 'llm_adapter/combined_gateway.py'
      - 'tests/test_node_advertisement.py'
      - 'tests/test_service_gateway_coinbase_skap.py'
      - 'tests/test_service_gateway_coinbase_skap_api.py'
      - 'tests/test_deployed_gateway_coinbase_skap.py'
      - 'docs/COINBASE_SKAP_SERVICE_GATEWAY_MIRROR_HANDOFF.md'
      - '.github/workflows/coinbase-skap-service-gateway.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse credential-bearing validation environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT OPENAI_API_KEY ANTHROPIC_API_KEY COINBASE_API_KEY COINBASE_API_SECRET COINBASE_API_PRIVATE_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:$key"
              exit 1
            fi
          done

      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install validation dependencies
        run: |
          python3 -m pip install -e '.[dev]'

      - name: Compile Coinbase staging source
        run: |
          python3 -m py_compile \
            llm_adapter/service_gateway_coinbase_skap.py \
            llm_adapter/service_gateway_composed.py \
            llm_adapter/runtime_gateway.py \
            llm_adapter/deployed_gateway.py \
            llm_adapter/service_gateway_http01.py \
            llm_adapter/combined_gateway.py \
            scripts/stegdeploy_bootstrap.py \
            tests/test_stegdeploy_native_tls.py \
            tests/test_service_gateway_coinbase_skap.py \
            tests/test_service_gateway_coinbase_skap_api.py \
            tests/test_deployed_gateway_coinbase_skap.py \
            tests/test_service_gateway_http01.py \
            tests/test_node_advertisement.py \
            tests/test_stegdeploy_native_tls.py

      - name: Validate staging and mounted HTTP boundary
        run: |
          python3 -m pytest -q \
            tests/test_service_gateway_coinbase_skap.py \
            tests/test_service_gateway_coinbase_skap_api.py \
            tests/test_deployed_gateway_coinbase_skap.py \
            tests/test_service_gateway_http01.py \
            tests/test_node_advertisement.py

      - name: Assert transport-only authority and first interlock boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('llm_adapter/service_gateway_coinbase_skap.py').read_text(encoding='utf-8')
          api = Path('llm_adapter/service_gateway_composed.py').read_text(encoding='utf-8')
          deployed = Path('llm_adapter/deployed_gateway.py').read_text(encoding='utf-8')
          combined = Path('llm_adapter/combined_gateway.py').read_text(encoding='utf-8')
          tls_compose = Path('compose.stegdeploy.tls.yaml').read_text(encoding='utf-8')
          bootstrap = Path('scripts/stegdeploy_bootstrap.py').read_text(encoding='utf-8')
          assert 'gateway_credential_value_access": False' in source
          assert 'gateway_decryption_authority": False' in source
          assert 'gateway_execution_authority": "NONE"' in source
          assert 'tvc_admission_completed": False' in source
          assert 'KV_SKAP_VAULT_INTERLOCK_ADMISSION' in source
          assert 'device_kv_interlock_receipt' in source
          assert 'from_boundary": "DEVICE"' in source
          assert 'to_boundary": "KV"' in source
          assert 'connector": "InTr"' in source
          assert 'prior_boundary_receipt_hash": None' in source
          assert 'secret_plaintext_present": False' in source
          assert 'authority_transfer": False' in source
          assert 'credential_values_available' in source
          assert 'allowed_keys' in source
          assert 'authorization_header_forbidden' in api
          assert 'cookie_header_forbidden' in api
          assert '/api/coinbase/skap/ingress' in api
          assert '/api/coinbase/skap/readiness' in deployed
          assert '/api/coinbase/skap/ingress' in deployed
          assert '/.well-known/acme-challenge/{token}' in deployed
          http01 = Path('llm_adapter/service_gateway_http01.py').read_text(encoding='utf-8')
          assert 'STEGVERSE_TVC_HTTP01_CHALLENGE_ROOT' in http01
          assert 'TV/TVC' in http01
          assert 'no-store' in http01
          for forbidden in ('private_key', 'sign_jws', 'newAccount', 'newOrder', 'revokeCert', 'dns-01'):
              assert forbidden not in http01
          assert 'coinbase_skap_readiness_endpoint' in combined
          assert 'coinbase_skap_ingress_endpoint' in combined
          assert 'coinbase_skap_gateway_execution_authority' in combined
          assert 'STEGDEPLOY_TLS_CERT_FILE' in tls_compose
          assert 'STEGDEPLOY_TLS_KEY_FILE' in tls_compose
          assert '/run/secrets/stegverse_tls_key' in tls_compose
          assert '--ssl-keyfile' in tls_compose
          assert 'deploy-tls' in bootstrap
          assert 'tls_private_key_material_recorded' in bootstrap
          assert 'production_public_route_observed' in bootstrap
          print('COINBASE_SKAP_GATEWAY_VALIDATION_ONLY=true')
          print('COINBASE_SKAP_GATEWAY_CREDENTIAL_AUTHORITY=NONE')
          print('COINBASE_SKAP_GATEWAY_EXECUTION_AUTHORITY=NONE')
          print('COINBASE_SKAP_DEVICE_KV_INTR_RECEIPT_REQUIRED=true')
          print('COINBASE_SKAP_NEXT_TRANSITION=KV_SKAP_VAULT_INTERLOCK_ADMISSION')
          PY
