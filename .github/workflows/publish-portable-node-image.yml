name: Publish Portable Ecosystem Chat Node

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.portable-node'
      - 'pyproject.toml'
      - 'llm_adapter/**'
      - '.github/workflows/publish-portable-node-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portable-node-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stegverse-ecosystem-chat-node
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish portable-node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.portable-node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
