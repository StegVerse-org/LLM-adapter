name: Platform-Agnostic Runtime

on:
  push:
    paths:
      - Dockerfile
      - compose.yaml
      - docs/runtime-environment.example
      - scripts/container-entrypoint.sh
      - docs/PLATFORM_AGNOSTIC_RUNTIME.md
      - llm_adapter/**
      - pyproject.toml
      - .github/workflows/platform-agnostic-runtime.yml
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - docs/runtime-environment.example
      - scripts/container-entrypoint.sh
      - docs/PLATFORM_AGNOSTIC_RUNTIME.md
      - llm_adapter/**
      - pyproject.toml
      - .github/workflows/platform-agnostic-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oci-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build provider-neutral image
        run: docker build --tag stegverse-llm-adapter:portability-test .

      - name: Start with durable volume and separated credentials
        run: |
          docker volume create stegverse-portability-data
          docker run -d --name stegverse-portability \
            -p 18000:8000 \
            -e PORT=8000 \
            -e STEGVERSE_HIL_INTAKE_ENABLED=true \
            -e STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS=true \
            -e STEGVERSE_HIL_REVIEW_TOKEN=review-test-only \
            -e STEGVERSE_HIL_PUBLICATION_TOKEN=publication-test-only \
            -v stegverse-portability-data:/var/lib/stegverse \
            stegverse-llm-adapter:portability-test

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs stegverse-portability
          exit 1

      - name: Verify HIL readiness contract
        run: |
          curl -fsS http://127.0.0.1:18000/api/stegverse-node | tee node.json
          curl -fsS http://127.0.0.1:18000/api/hil/readiness | tee hil-readiness.json
          curl -fsS http://127.0.0.1:18000/api/hil/publication-readiness | tee publication-readiness.json
          python - <<'PY'
          import json
          readiness = json.load(open('hil-readiness.json', encoding='utf-8'))
          assert readiness['state'] == 'READY', readiness
          assert readiness['primary_sha256'] == '52102cccb9ba9016c76434a64e22031b6a8c3edd3b8806e7b664e609216b2946'
          assert readiness['prompt_sha256'] == '0ebe215318b4eeeb8ed6422e0954372c314fadc8fac9254e452bc7670a1b9922'
          assert readiness['private_review_configured'] is True
          node = json.load(open('node.json', encoding='utf-8'))
          assert node['hil_intake_enabled'] is True
          assert node['durable_storage'] is True
          assert node['authority_granted'] is False
          PY

      - name: Prove mounted-state persistence across replacement
        run: |
          docker exec stegverse-portability sh -c 'printf portability-proof > /var/lib/stegverse/portability-proof.txt'
          docker rm -f stegverse-portability
          docker run -d --name stegverse-portability-restarted \
            -p 18000:8000 \
            -e PORT=8000 \
            -e STEGVERSE_HIL_INTAKE_ENABLED=true \
            -e STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS=true \
            -e STEGVERSE_HIL_REVIEW_TOKEN=review-test-only \
            -e STEGVERSE_HIL_PUBLICATION_TOKEN=publication-test-only \
            -v stegverse-portability-data:/var/lib/stegverse \
            stegverse-llm-adapter:portability-test
          for attempt in $(seq 1 30); do
            if docker exec stegverse-portability-restarted test -f /var/lib/stegverse/portability-proof.txt; then
              value=$(docker exec stegverse-portability-restarted cat /var/lib/stegverse/portability-proof.txt)
              test "$value" = portability-proof
              exit 0
            fi
            sleep 1
          done
          docker logs stegverse-portability-restarted
          exit 1

      - name: Export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-agnostic-runtime-evidence
          path: |
            node.json
            hil-readiness.json
            publication-readiness.json
