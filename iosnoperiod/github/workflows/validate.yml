# Deterministic repository validation only. Live activation belongs to StegVerse resident workers + TV/TVC.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "credential_exposed:$key"
              exit 1
            fi
          done

      - name: Fetch exact source anonymously
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/StegVerse-org/LLM-adapter.git
          git -c http.extraheader= fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve Python 3.11 without token-backed setup actions
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          if command -v python3.11 >/dev/null 2>&1; then
            selected="$(command -v python3.11)"
          else
            selected="$(find "${RUNNER_TOOL_CACHE:-/nonexistent}" -type f -name python 2>/dev/null | grep -E '[/\\]Python[/\\]3\.11([./\\]|$)' | head -n 1 || true)"
          fi
          if [ -z "$selected" ]; then
            bootstrap="$(command -v python3 || command -v python || true)"
            if [ -z "$bootstrap" ]; then
              echo "bootstrap_python_not_found"
              exit 1
            fi
            "$bootstrap" -m pip install --user uv
            uv_bin="$(command -v uv || true)"
            if [ -z "$uv_bin" ]; then
              user_base="$($bootstrap -m site --user-base)"
              uv_bin="$user_base/bin/uv"
            fi
            "$uv_bin" python install 3.11
            selected="$($uv_bin python find 3.11)"
          fi
          echo "PYTHON_BIN=$selected" >> "$GITHUB_ENV"
          "$selected" --version
          "$selected" - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          print('GLOBAL_VALIDATE_PYTHON=PASS')
          PY

      - name: Install validation dependencies
        run: "$PYTHON_BIN -m pip install -e '.[dev]'"
      - name: Verify StegDeploy runtime contract
        run: "$PYTHON_BIN scripts/verify_stegdeploy_runtime.py"
      - name: Verify StegDeploy image receipt retention
        run: "$PYTHON_BIN scripts/check_stegdeploy_image_receipt_retention.py"
      - name: Check lightweight package init
        run: "$PYTHON_BIN scripts/check_lightweight_package_init.py"
      - name: Verify micro-node return path
        run: "$PYTHON_BIN scripts/verify_micro_node_return_path.py"
      - name: Verify provider boundary
        run: "$PYTHON_BIN scripts/verify_ai_entry_provider_boundary.py"
      - name: Verify backend service
        run: "$PYTHON_BIN scripts/verify_ai_entry_backend_service.py"
      - name: Verify endpoint
        run: "$PYTHON_BIN scripts/verify_ai_entry_endpoint.py"
      - name: Verify service wrapper
        run: "$PYTHON_BIN scripts/verify_ai_entry_service_wrapper.py"
      - name: Check no-manual-task wiring
        run: "$PYTHON_BIN scripts/check_ai_entry_no_manual_tasks.py"
      - name: Verify free-tier quota
        run: "$PYTHON_BIN scripts/verify_free_tier_quota.py"
      - name: Verify free-tier limits
        run: "$PYTHON_BIN scripts/verify_free_tier_limits.py"
      - name: Verify free-tier metadata
        run: "$PYTHON_BIN scripts/verify_ai_entry_free_tier_metadata.py"
      - name: Verify capability manifest
        run: "$PYTHON_BIN scripts/verify_free_tier_capability_manifest.py"
      - name: Verify transition candidate
        run: "$PYTHON_BIN scripts/verify_llm_transition_candidate.py examples/llm_transition_candidate.json"
      - name: Verify recursive comparison telemetry
        run: "$PYTHON_BIN scripts/verify_recursive_comparison.py"
      - name: Verify adapter role and provider usage
        run: "$PYTHON_BIN scripts/verify_provider_usage.py"
      - name: Validate provider-owned usage event
        run: "$PYTHON_BIN scripts/verify_provider_usage_event.py"
      - name: Test provider-owned usage event adversarial cases
        run: "$PYTHON_BIN -m pytest -q tests/test_provider_usage_event.py"
      - name: Validate Ecosystem Chat zero-external-dependency sovereignty contract
        run: "$PYTHON_BIN scripts/check_ecosystem_chat_service_adoption.py"
      - name: Validate outcome-level objective contract
        run: "$PYTHON_BIN scripts/validate_objective_contract.py"
      - name: Test Chat LLM profile policy layer
        run: "$PYTHON_BIN -m pytest tests/test_chat_llm_profiles.py -q"
      - name: Build deterministic Chat LLM profile validation receipt
        run: "$PYTHON_BIN scripts/verify_chat_llm_profiles.py --write-receipt"
      - name: Test Chat provider-neutral session binding
        run: "$PYTHON_BIN -m pytest tests/test_chat_session_binding.py -q"
      - name: Build deterministic Chat session-binding validation receipt
        run: "$PYTHON_BIN scripts/verify_chat_session_binding.py --write-receipt"
      - name: Compile public-knowledge and VACC source surfaces
        run: >-
          "$PYTHON_BIN" -m py_compile
          llm_adapter/public_knowledge.py
          llm_adapter/ai_entry_backend_service.py
          llm_adapter/vacc_public_information.py
          tests/test_public_knowledge.py
          tests/test_vacc_public_information.py
      - name: Validate public-knowledge and VACC source policy
        run: >-
          "$PYTHON_BIN" -m unittest -q
          tests.test_public_knowledge
          tests.test_vacc_public_information
      - name: Verify authenticated usage session endpoint
        run: "$PYTHON_BIN scripts/verify_usage_session_api.py"
      - name: Verify External Chat staging posture
        run: "$PYTHON_BIN scripts/verify_external_publication_staging.py"
      - name: Test micro-node return path
        run: "$PYTHON_BIN -m pytest tests/test_micro_node_return_path.py -v"
      - name: Test provider boundary
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_provider_boundary.py -v"
      - name: Test backend service
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_backend_service.py -v"
      - name: Test backend preview marker
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_backend_preview_marker.py -v"
      - name: Test endpoint
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_endpoint.py -v"
      - name: Test service wrapper
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_service_wrapper.py -v"
      - name: Test free-tier quota
        run: "$PYTHON_BIN -m pytest tests/test_free_tier_quota.py -v"
      - name: Test free-tier limits
        run: "$PYTHON_BIN -m pytest tests/test_free_tier_limits.py -v"
      - name: Test free-tier trust metadata
        run: "$PYTHON_BIN -m pytest tests/test_ai_entry_free_tier_trust_metadata.py -v"
      - name: Test transition candidate
        run: "$PYTHON_BIN -m pytest tests/test_transition_candidate.py -v"
      - name: Test recursive comparison telemetry
        run: "$PYTHON_BIN -m pytest tests/test_recursive_comparison.py -v"
      - name: Test adapter role and provider usage
        run: "$PYTHON_BIN -m pytest tests/test_provider_usage.py -v"
      - name: Test Master-Records provider usage custody submission
        run: "$PYTHON_BIN -m pytest tests/test_master_records_usage_submission.py -v"
      - name: Test live activation automation contract without executing activation
        run: >-
          "$PYTHON_BIN" -m pytest
          tests/test_live_activation_automation_contract.py
          tests/test_live_activation_monitor_no_deploy_churn.py
          tests/test_provider_readiness_stable_projection.py
          tests/test_live_activation_status_persistence.py -v
      - name: Test StegVerse node advertisement contract
        run: "$PYTHON_BIN -m pytest tests/test_node_advertisement.py -v"
      - name: Check immutable verified activation receipt contract
        run: "$PYTHON_BIN scripts/check_ecosystem_chat_verified_receipt_contract.py"
      - name: Test authenticated usage session endpoint
        run: "$PYTHON_BIN -m pytest tests/test_usage_session_api.py -v"
      - name: Test system-boundary declaration lifecycle, fixture provenance, and workflow evidence
        run: >-
          "$PYTHON_BIN" -m pytest
          tests/test_system_boundary.py
          tests/test_system_boundary_binding.py
          tests/test_system_boundary_receipt.py
          tests/test_system_boundary_lifecycle.py
          tests/test_system_boundary_sdk_fixture.py
          tests/test_system_boundary_fixture_provenance.py
          tests/test_system_boundary_workflow_evidence.py -v
      - name: Test External Chat compatibility
        run: "$PYTHON_BIN -m pytest tests/test_external_framework_compatibility.py -v"
      - name: Test External Review package intake
        run: "$PYTHON_BIN -m pytest tests/test_external_review_api.py::test_package_only_intake_is_authenticated_append_only_and_idempotent -v"
      - name: Test External Review package conflict
        run: "$PYTHON_BIN -m pytest tests/test_external_review_api.py::test_package_rejects_raw_submission_and_conflicting_content -v"
      - name: Test External Review delegated receipt
        run: "$PYTHON_BIN -m pytest tests/test_external_review_api.py::test_delegated_reviewer_can_issue_one_identity_bound_receipt -v"
      - name: Test External Review identity drift
        run: "$PYTHON_BIN -m pytest tests/test_external_review_api.py::test_scope_and_identity_drift_fail_closed -v"
      - name: Test External Review expired delegation
        run: "$PYTHON_BIN -m pytest tests/test_external_review_api.py::test_expired_reviewer_delegation_is_rejected -v"
      - name: Test External Chat publication and mutation
        run: "$PYTHON_BIN -m pytest tests/test_external_review_publication.py tests/test_external_publication_mutation.py -v"
      - name: Check workflow parity
        run: "$PYTHON_BIN scripts/check_workflow_parity.py"
      - name: Check authority boundary
        run: "$PYTHON_BIN scripts/check_ai_entry_authority_boundary.py"
      - name: Check receipt boundary
        run: "$PYTHON_BIN scripts/check_ai_entry_receipt_boundary.py"
      - name: Check provider capture boundary
        run: "$PYTHON_BIN scripts/check_ai_entry_provider_capture_boundary.py"
      - name: Check provider capture fixtures
        run: "$PYTHON_BIN scripts/check_ai_entry_provider_capture_fixtures.py"
      - name: Check provider capture completion
        run: "$PYTHON_BIN scripts/check_ai_entry_provider_capture_completion.py"
      - name: Check recovery boundary
        run: "$PYTHON_BIN scripts/check_ai_entry_recovery_boundary.py"
      - name: Run canonical Goal 4 verification
        run: "$PYTHON_BIN scripts/verify_goal4_full.py"

      - name: Confirm validation-only authority boundary
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate.yml').read_text(encoding='utf-8')
          forbidden = [
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'persist-' + 'credentials',
              'git ' + 'push',
              'verify_' + 'live_ecosystem_chat_activation.py',
              'schedule' + ':',
          ]
          assert 'permissions: {}' in workflow
          assert 'cancel-in-progress: true' in workflow
          assert 'verify_provider_usage_event.py' in workflow
          assert 'tests/test_provider_usage_event.py' in workflow
          assert 'check_ecosystem_chat_service_adoption.py' in workflow
          assert 'validate_objective_contract.py' in workflow
          assert 'tests/test_chat_llm_profiles.py' in workflow
          assert 'verify_chat_llm_profiles.py --write-receipt' in workflow
          assert 'tests/test_chat_session_binding.py' in workflow
          assert 'verify_chat_session_binding.py --write-receipt' in workflow
          assert 'tests.test_public_knowledge' in workflow
          assert 'tests.test_vacc_public_information' in workflow
          assert 'OPENAI_API_KEY' in workflow and 'ANTHROPIC_API_KEY' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('GLOBAL_VALIDATE_CREDENTIAL_AUTHORITY=TV_TVC')
          print('GLOBAL_VALIDATE_GITHUB_TOKEN_AUTHORITY=NONE')
          print('GLOBAL_VALIDATE_ACTIVATION_EFFECT=NONE')
          PY
