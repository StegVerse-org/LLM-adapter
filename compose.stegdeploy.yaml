services:
  ecosystem-chat-gateway:
    image: ${STEGDEPLOY_IMAGE:-stegverse/llm-adapter:local}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "${STEGDEPLOY_BIND_ADDRESS:-127.0.0.1}:${STEGDEPLOY_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      STEGVERSE_DATA_DIR: /var/lib/stegverse
      STEGVERSE_ALLOWED_ORIGINS: ${STEGVERSE_ALLOWED_ORIGINS:-https://stegverse.org,https://www.stegverse.org,https://stegverse-labs.github.io}
      STEGVERSE_CHAT_RATE_LIMIT: ${STEGVERSE_CHAT_RATE_LIMIT:-20}
      STEGVERSE_CHAT_RATE_WINDOW_SECONDS: ${STEGVERSE_CHAT_RATE_WINDOW_SECONDS:-3600}
      STEGVERSE_STORAGE_DURABLE_ACROSS_RESTARTS: "true"
      STEGVERSE_SERVICE_GATEWAY_STORAGE_ROOT: /var/lib/stegverse
      # The deployed gateway already contains the canonical HIL v1.1 intake.
      # Declaring this runtime as the sovereign carrier activates that existing
      # receiver against the same durable StegDeploy state volume. No second
      # HIL web process, public tunnel, participant machine, or GitHub runtime
      # becomes necessary or authoritative.
      STEGVERSE_RUNTIME_PROFILE: sovereign-carrier
      STEGVERSE_SOVEREIGN_STATE_DURABLE: "true"
      STEGVERSE_SOVEREIGN_STATE_DIR: /var/lib/stegverse
      STEGVERSE_COINBASE_SKAP_TVC_DECISION_RECEIPT: ${STEGVERSE_COINBASE_SKAP_TVC_DECISION_RECEIPT:-}
      STEGVERSE_EXTERNAL_REVIEW_SUBMIT_TOKEN: ${STEGVERSE_EXTERNAL_REVIEW_SUBMIT_TOKEN:-}
      STEGVERSE_EXTERNAL_REVIEW_RECEIPT_KEY: ${STEGVERSE_EXTERNAL_REVIEW_RECEIPT_KEY:-}
      STEGVERSE_EXTERNAL_REVIEWERS_JSON: ${STEGVERSE_EXTERNAL_REVIEWERS_JSON:-{}}
      STEGVERSE_EXTERNAL_PUBLISHERS_JSON: ${STEGVERSE_EXTERNAL_PUBLISHERS_JSON:-{}}
      STEGVERSE_EXTERNAL_MUTATION_ENABLED: ${STEGVERSE_EXTERNAL_MUTATION_ENABLED:-false}
      STEGVERSE_MASTER_RECORDS_ENDPOINT: ${STEGVERSE_MASTER_RECORDS_ENDPOINT:-http://127.0.0.1:9}
      STEGVERSE_MASTER_RECORDS_TOKEN: ${STEGVERSE_MASTER_RECORDS_TOKEN:-}
      STEGVERSE_MASTER_RECORDS_ALLOWED_HOSTS: ${STEGVERSE_MASTER_RECORDS_ALLOWED_HOSTS:-127.0.0.1}
      STEGVERSE_PROVIDER_ENABLED: ${STEGVERSE_PROVIDER_ENABLED:-false}
      STEGVERSE_PROVIDER_ENDPOINT: ${STEGVERSE_PROVIDER_ENDPOINT:-https://provider.invalid}
      STEGVERSE_PROVIDER_ALLOWED_HOSTS: ${STEGVERSE_PROVIDER_ALLOWED_HOSTS:-provider.invalid}
      STEGVERSE_PROVIDER_TOKEN: ${STEGVERSE_PROVIDER_TOKEN:-}
      STEGVERSE_PROVIDER_NAME: ${STEGVERSE_PROVIDER_NAME:-disabled}
      STEGVERSE_PROVIDER_MODEL: ${STEGVERSE_PROVIDER_MODEL:-disabled}
      STEGVERSE_PROVIDER_DAILY_REQUEST_LIMIT: ${STEGVERSE_PROVIDER_DAILY_REQUEST_LIMIT:-25}
      STEGVERSE_PROVIDER_DAILY_COST_LIMIT_USD: ${STEGVERSE_PROVIDER_DAILY_COST_LIMIT_USD:-1.00}
      STEGVERSE_PROVIDER_MAX_REQUEST_COST_USD: ${STEGVERSE_PROVIDER_MAX_REQUEST_COST_USD:-0.10}
      STEGVERSE_PROVIDER_MAX_INPUT_CHARS: ${STEGVERSE_PROVIDER_MAX_INPUT_CHARS:-12000}
      STEGVERSE_PROVIDER_MAX_OUTPUT_CHARS: ${STEGVERSE_PROVIDER_MAX_OUTPUT_CHARS:-6000}
      STEGVERSE_PROVIDER_TIMEOUT_SECONDS: ${STEGVERSE_PROVIDER_TIMEOUT_SECONDS:-20}
    volumes:
      - stegverse_gateway_data:/var/lib/stegverse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  stegverse_gateway_data:
    name: ${STEGDEPLOY_VOLUME_NAME:-stegverse-ecosystem-chat-data}
